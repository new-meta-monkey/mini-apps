<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- pink prism -->
  <polygon points="256,84 396,330 116,330" fill="#f472b6"/>
  <polygon points="256,84 396,330 256,330" fill="#ec4899" opacity="0.85"/>
  <!-- sky marble -->
  <circle cx="352" cy="150" r="58" fill="#38bdf8"/>
  <circle cx="334" cy="132" r="16" fill="#ffffff" opacity="0.7"/>
  <!-- amber diamond -->
  <polygon points="392,392 452,452 392,512 332,452" fill="#fbbf24"/>
  <!-- green prism -->
  <polygon points="108,368 188,368 148,448" fill="#4ade80"/>
  <!-- gloss -->
  <rect width="512" height="256" rx="112" fill="url(#gloss)"/>
</svg>
