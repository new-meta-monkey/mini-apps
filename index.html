  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap');

    .sheet {
      background: #fff;

      max-height: 88vh;

    .sheet-handle {

    .ghost-btn {

    footer { margin-top: 40px; font-size: 13px; color: #8A97B0; text-align: center; line-height: 1.6; }
    @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {

      .overlay.open .sheet { transform: none; }
      .sheet-handle { display: none; }
    }
    @media (max-width: 1023px) {
      body { padding: 24px 16px 24px; }
      h1 { font-size: 32px; }
      .gear { width: 40px; height: 40px; font-size: 22px; }
      .grid {
        display: flex;
        flex-direction: column;
        gap: 0;
        max-width: 480px;
        margin-top: 8px;
      }
      .card {
        flex-direction: row;
        align-items: center;
        gap: 14px;
        padding: 16px 4px;
        background: transparent;
        border: none;
        border-radius: 0;
        box-shadow: none;
        text-align: left;
        border-bottom: 1px solid #F0E6D8;
      }
      .card:last-child { border-bottom: none; }
      .card img { width: 56px; height: 56px; border-radius: 14px; flex: 0 0 auto; }
      .card-text { display: block; flex: 1 1 auto; min-width: 0; }
      .card h2 { font-size: 16px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card .cat { background: transparent; border: none; padding: 0; font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; color: #8A97B0; }
      .card .cat::after { content: ' · Free'; }
      .card p { display: -webkit-box; font-size: 13px; line-height: 1.45; margin-top: 3px; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .card .open, .card .install-note { display: none; }
      .card-actions { flex: 0 0 auto; width: auto; }
      .card-star { flex: 0 0 40px; width: 40px; height: 40px; font-size: 22px; background: transparent; border: none; border-radius: 50%; }
      .sheet { width: 100%; max-width: 100%; max-height: 86vh; max-height: 86dvh; border-radius: 16px 16px 0 0; margin: 0; }
      .overlay { align-items: flex-end; padding: 0; margin: 0; }
      .sheet-head img.app-icon { width: 56px; height: 56px; border-radius: 14px; }

      .sheet-head-text .tagline { font-size: 14px; }
      .sheet-section-title { margin-top: 16px; }
      .sheet-body ul { font-size: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Mini Apps</h1>
      <button id="gearBtn" class="gear" type="button" aria-label="Settings">&#9881;</button>
    </div>
    <p>Small apps, one tap each. Open one below, or install it on your phone like a real app.</p>
    <input id="search" class="search" type="search" placeholder="Search apps..." aria-label="Search apps" />
    <div id="chips" class="chips"></div>
    <div id="undoBar" class="undo-bar">
      <span>Restore done. Your previous data is kept as a safety copy.</span>
      <button id="undoRestoreBtn" type="button">Undo restore</button>
    </div>
    <input id="restoreFile" type="file" accept="application/json,.json" hidden />
  </header>

  <main id="grid" class="grid"></main>

  <noscript>
    <div style="max-width: 620px; margin: 28px auto 0; text-align: center; line-height: 1.7; font-size: 15px; color: #5A6B8A;">
      <p><strong>Wonder Kids GK</strong> — Kids &amp; Learning. Learn with flip cards, then take the Challenge quiz. 11 topics for kids ages 7 to 15, with photos, scores and a leaderboard. <a href="./wonder-kids-gk/">Open Wonder Kids GK</a></p>
      <p><strong>SleepPulse</strong> — Health. One-click sleep tracker. Log bedtime and wake-up, see your week at a glance, all stored privately on your device. <a href="./sleep-pulse/">Open SleepPulse</a></p>
      <p><strong>ShopPulse</strong> — Money. Offline shop manager — POS billing, stock, sales, expenses and reports. Multi-shop, works without internet. <a href="./shop-pulse/">Open ShopPulse</a></p>
      <p><strong>ChitManager</strong> — Money. Run chit groups end to end — members, monthly draws, payments and ledger. <a href="./chit-manager/">Open ChitManager</a></p>
    </div>
  </noscript>

  <div id="sheetOverlay" class="overlay">
    <div id="sheet" class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle" id="sheetHandle"></div>
      <button type="button" class="sheet-close" id="sheetClose" aria-label="Close">&times;</button>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <footer>
    Each app installs separately &mdash; open it, then use your browser&rsquo;s Install option.<br />
    More mini apps coming soon.
  </footer>

<script>
var APPS = [
  {
    id: 'wonder-kids-gk',
    name: 'Wonder Kids GK',
    cat: 'kids',
    accent: '#FF6B6B',
    icon: './wonder-kids-gk/icon-192.png',
    tagline: 'Learn with flip cards, then take the Challenge quiz. 11 topics for kids ages 7 to 15, with photos, scores and a leaderboard.',
    desc: 'A general knowledge quiz app for kids. Flip through photo cards to learn, then take the Challenge quiz in each topic. Scores save to a leaderboard, and everything works offline once installed.',
    features: ['11 topics · 330 learn cards · 330 quiz questions', 'Streak boost: 3 correct in a row doubles points', 'Leaderboard with player names'],
    folder: './wonder-kids-gk/',
    zip: './downloads/wonder-kids-gk.zip'
  },
  {
    id: 'sleep-pulse',
    name: 'SleepPulse',
    cat: 'health',
    accent: '#7B61FF',
    icon: './sleep-pulse/icon.svg',
    tagline: 'One-click sleep tracker. Log bedtime and wake-up, see your week at a glance, all stored privately on your device.',
    desc: 'Tap once when you sleep and once when you wake. SleepPulse works out your hours, your weekly balance against the 8-hour goal, and shows a simple sleep coach note. No account, no cloud, everything stays on your phone.',
    features: ['One-tap sleep and wake logging', '7-day averages against the 8-hour goal', 'History, quality rating and CSV export'],
    folder: './sleep-pulse/',
    zip: './downloads/sleep-pulse.zip'
  },
  {
    id: 'shop-pulse',
    name: 'ShopPulse',
    cat: 'money',
    accent: '#2EC4B6',
    icon: './shop-pulse/icon.svg',
    tagline: 'Offline shop manager — POS billing, stock, sales, expenses and reports. Multi-shop, works without internet.',
    desc: 'A full shop manager that runs entirely offline. Billing with invoices, stock, purchases, customers, expenses, staff and reports across multiple shops, with its own backup and restore built in.',
    features: ['POS billing with invoices and returns', 'Stock, customers and suppliers', 'Expenses, payroll and profit reports'],
    folder: './shop-pulse/',
    zip: './downloads/shop-pulse.zip'
  },
  {
    id: 'chit-manager',
    name: 'ChitManager',
    cat: 'money',
    accent: '#7B61FF',
    icon: './chit-manager/icon.svg',
    tagline: 'Run chit groups end to end — members, monthly draws, payments and ledger.',
    desc: 'ChitManager runs a chit fund end to end: create a chit group, track members and monthly payments, conduct the monthly draw, and keep the full cycle ledger. Share payment reminders on WhatsApp. All data stays on your device.',
    features: ['Chit groups, members & monthly payments', 'Monthly draw with full cycle ledger', 'WhatsApp payment reminders'],
    folder: './chit-manager/',
    zip: './downloads/chit-manager.zip'
  }
];

var CATS = [
  { id: 'all', label: 'All' },
  { id: 'fav', label: 'Favourites' },
  { id: 'kids', label: 'Kids & Learning' },
  { id: 'health', label: 'Health' },
  { id: 'money', label: 'Money' },
  { id: 'focus', label: 'Focus & Everyday' },
  { id: 'fun', label: 'Fun' }
];

var FAV_KEY = 'mini-apps-favs-v1';
var LAST_BACKUP_KEY = 'mini-apps-last-backup';
var SAFETY_KEY = 'mini-apps-pre-restore';

var state = { q: '', cat: 'all' };
var sheetKind = null; /* 'app' | 'settings' | null */
var sheetAppId = null;

function getFavs() {
  try {
    var v = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}

function isFav(id) { return getFavs().indexOf(id) !== -1; }

function toggleFav(id) {
  var favs = getFavs();
  var i = favs.indexOf(id);
  if (i === -1) { favs.push(id); } else { favs.splice(i, 1); }
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) {}
  render();
  if (sheetKind === 'app' && sheetAppId === id) { renderAppSheet(id); }
}

function catLabel(id) {
  for (var i = 0; i < CATS.length; i++) { if (CATS[i].id === id) return CATS[i].label; }
  return id;
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderChips() {
  var box = document.getElementById('chips');
  var html = '';
  CATS.forEach(function (c) {
    html += '<button type="button" class="chip' + (state.cat === c.id ? ' active' : '') + '" data-cat="' + c.id + '">' + esc(c.label) + '</button>';
  });
  box.innerHTML = html;
  var btns = box.querySelectorAll('.chip');
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      state.cat = b.getAttribute('data-cat');
      render();
      if (b.scrollIntoView) { b.scrollIntoView({ inline: 'center', block: 'nearest' }); }
    });
  });
}

function filteredApps() {
  var q = state.q.trim().toLowerCase();
  var favs = getFavs();
  return APPS.filter(function (a) {
    if (state.cat === 'fav' && favs.indexOf(a.id) === -1) return false;
    if (state.cat !== 'all' && state.cat !== 'fav' && a.cat !== state.cat) return false;
    if (q) {
      var hay = (a.name + ' ' + a.tagline + ' ' + a.desc + ' ' + catLabel(a.cat)).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

function render() {
  renderChips();
  var grid = document.getElementById('grid');
  var list = filteredApps();
  if (!list.length) {
    var msg = state.cat === 'fav'
      ? 'No favourites yet. Tap the star on any app to pin it here.'
      : 'No apps match your search. Try another word.';
    grid.innerHTML = '<div class="empty">' + msg + '</div>';
    return;
  }
  var html = '';
  list.forEach(function (a) {
    html += '<section class="card" data-app="' + a.id + '">'
      + '<img src="' + a.icon + '" alt="' + esc(a.name) + ' icon" />'
      + '<div class="card-text">'
      + '<h2>' + esc(a.name) + '</h2>'
      + '<span class="cat">' + esc(catLabel(a.cat)) + '</span>'
      + '<p>' + esc(a.tagline) + '</p>'
      + '</div>'
      + '<div class="card-actions">'
      + '<a class="open" style="background:' + a.accent + '" href="' + a.folder + '">Open ' + esc(a.name) + '</a>'
      + '<button type="button" class="card-star' + (isFav(a.id) ? ' fav' : '') + '" data-star="' + a.id + '" aria-label="Favourite ' + esc(a.name) + '">' + (isFav(a.id) ? '★' : '☆') + '</button>'
      + '</div>'
      + '<span class="install-note">Installable app &middot; works offline</span>'
      + '</section>';
  });
  grid.innerHTML = html;
  grid.querySelectorAll('.card').forEach(function (card) {
    card.addEventListener('click', function (ev) {
      if (ev.target.closest('.card-star') || ev.target.closest('.open')) return;
      location.hash = '#/app/' + card.getAttribute('data-app');
    });
  });
  grid.querySelectorAll('[data-star]').forEach(function (btn) {
    btn.addEventListener('click', function (ev) {
      ev.stopPropagation();
      toggleFav(btn.getAttribute('data-star'));
    });
  });
}

/* ---------- Bottom sheet / modal ---------- */

function showSheet() {
  document.getElementById('sheet').scrollTop = 0;
  document.getElementById('sheetOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function hideSheet() {
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('sheet').style.transform = '';
  document.body.style.overflow = '';
  sheetKind = null;
  sheetAppId = null;
}

function closeSheet() {
  if (location.hash === '#/app/' + (sheetAppId || '') || location.hash === '#/settings') {
    location.hash = '#/';
  } else {
    hideSheet();
  }
}

function renderAppSheet(id) {
  var a = null;
  APPS.forEach(function (x) { if (x.id === id) a = x; });
  if (!a) return;
  var fav = isFav(a.id);
  var feats = a.features.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('');
  document.getElementById('sheetBody').innerHTML =
    '<div class="sheet-head">'
    + '<img class="app-icon" src="' + a.icon + '" alt="' + esc(a.name) + ' icon" />'
    + '<div class="sheet-head-text">'
    + '<h2>' + esc(a.name) + '</h2>'
    + '<span class="cat">' + esc(catLabel(a.cat)) + '</span>'
    + '<p class="tagline">' + esc(a.tagline) + '</p>'
    + '</div></div>'
    + '<div class="sheet-section-title">About this app</div>'
    + '<ul>' + feats + '</ul>'
    + '<div class="sheet-actions">'
    + '<a class="open" style="background:' + a.accent + '" href="' + a.folder + '">Open ' + esc(a.name) + '</a>'
    + '<a class="ghost-btn" href="' + a.zip + '" download>Download app</a>'
    + '<button type="button" class="ghost-btn fav-btn" id="sheetFavBtn" aria-label="' + (fav ? 'Remove from favourites' : 'Add to favourites') + '">' + (fav ? '★' : '☆') + '</button>'
    + '</div>'
    + '<span class="install-note">Installable app &middot; works offline.</span>';
  document.getElementById('sheetFavBtn').addEventListener('click', function () {
    toggleFav(a.id);
  });
}

function openAppSheet(id) {
  var found = false;
  APPS.forEach(function (x) { if (x.id === id) found = true; });
  if (!found) { location.hash = '#/'; return; }
  sheetKind = 'app';
  sheetAppId = id;
  renderAppSheet(id);
  showSheet();
}

function openSettingsSheet() {
  sheetKind = 'settings';
  sheetAppId = null;
  document.getElementById('sheetBody').innerHTML =
    '<h2>Settings</h2>'
    + '<p class="tagline">Your apps and their data stay on this device. Back up before switching phones.</p>'
    + '<div class="sheet-actions">'
    + '<button type="button" class="ghost-btn wide" id="settingsBackupBtn">Backup all apps</button>'
    + '<button type="button" class="ghost-btn wide" id="settingsRestoreBtn">Restore from backup</button>'
    + '</div>'
    + '<span id="settingsLastBackup" class="last-backup"></span>'
    + '<span class="install-note">Backup downloads one file with all three apps&rsquo; data. Restore replaces the data in the apps it covers and keeps a safety copy you can undo.</span>';
  document.getElementById('settingsBackupBtn').addEventListener('click', function () {
    backupAll();
    showLastBackup();
  });
  document.getElementById('settingsRestoreBtn').addEventListener('click', function () {
    document.getElementById('restoreFile').click();
  });
  showLastBackup();
  showSheet();
}

function route() {
  var h = location.hash;
  if (h.indexOf('#/app/') === 0) {
    openAppSheet(h.slice(6));
  } else if (h === '#/settings') {
    openSettingsSheet();
  } else {
    hideSheet();
    render();
  }
}

/* ---------- Backup: one file for all apps ---------- */

var BACKUP_SPEC = {
  'sleep-pulse': ['sleeppulse_logs_v1', 'sleeppulse_active_sleep_v1', 'sleeppulse_theme_v1'],
  'shop-pulse': null, /* every key starting with mobidukaan_pro_ plus md_device_id */
  'wonder-kids-gk': ['wgkKidId', 'wgkKidName', 'wgkCardAnim'],
  'chit-manager': ['kovai_chit_manager_v4']
};

function collectAppData(appId) {
  var data = {};
  if (appId === 'shop-pulse') {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && (k.indexOf('mobidukaan_pro_') === 0 || k === 'md_device_id')) {
        data[k] = localStorage.getItem(k);
      }
    }
    return data;
  }
  var keys = BACKUP_SPEC[appId] || [];
  keys.forEach(function (k) {
    var v = localStorage.getItem(k);
    if (v !== null) data[k] = v;
  });
  return data;
}

function collectAllKeys() {
  var keys = [];
  APPS.forEach(function (a) {
    if (a.id === 'shop-pulse') {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && (k.indexOf('mobidukaan_pro_') === 0 || k === 'md_device_id')) keys.push(k);
      }
    } else {
      (BACKUP_SPEC[a.id] || []).forEach(function (k) { keys.push(k); });
    }
  });
  return keys;
}

function downloadFile(name, text) {
  var blob = new Blob([text], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

function todayStr() {
  var d = new Date();
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function showLastBackup() {
  var el = document.getElementById('settingsLastBackup');
  if (!el) return;
  var v = null;
  try { v = localStorage.getItem(LAST_BACKUP_KEY); } catch (e) {}
  el.textContent = v ? 'Last backup: ' + v.slice(0, 10) : 'Last backup: never';
}

function backupAll() {
  var apps = {};
  APPS.forEach(function (a) { apps[a.id] = collectAppData(a.id); });
  var payload = {
    format: 'mini-apps-backup',
    version: 1,
    exportedAt: new Date().toISOString(),
    apps: apps
  };
  downloadFile('mini-apps-backup-' + todayStr() + '.json', JSON.stringify(payload));
  try { localStorage.setItem(LAST_BACKUP_KEY, payload.exportedAt); } catch (e) {}
  showLastBackup();
}

function saveSafetyCopy() {
  var data = {};
  collectAllKeys().forEach(function (k) {
    var v = localStorage.getItem(k);
    if (v !== null) data[k] = v;
  });
  try {
    localStorage.setItem(SAFETY_KEY, JSON.stringify({ savedAt: new Date().toISOString(), data: data }));
  } catch (e) {}
}

function restoreKeys(data) {
  Object.keys(data).forEach(function (k) {
    try { localStorage.setItem(k, data[k]); } catch (e) {}
  });
}

function restoreFile(file) {
  var reader = new FileReader();
  reader.onload = function () {
    var parsed = null;
    try { parsed = JSON.parse(reader.result); } catch (e) {}
    if (!parsed || parsed.format !== 'mini-apps-backup' || parsed.version !== 1) {
      alert('This file is not a Mini Apps backup.');
      return;
    }
    var isSingle = parsed.app && parsed.data;
    var target = isSingle ? 'the ' + parsed.app + ' app' : 'all apps';
    if (!confirm('Restore this backup into ' + target + '? This replaces the current data there. A safety copy of your current data will be kept.')) return;
    saveSafetyCopy();
    if (isSingle) {
      if (!BACKUP_SPEC.hasOwnProperty(parsed.app) && parsed.app !== 'shop-pulse') {
        alert('This backup is for an unknown app: ' + parsed.app);
        return;
      }
      restoreKeys(parsed.data);
    } else if (parsed.apps) {
      Object.keys(parsed.apps).forEach(function (appId) {
        restoreKeys(parsed.apps[appId] || {});
      });
    }
    document.getElementById('undoBar').classList.add('show');
  };
  reader.readAsText(file);
}

function undoRestore() {
  var raw = null;
  try { raw = localStorage.getItem(SAFETY_KEY); } catch (e) {}
  if (!raw) { alert('No safety copy found.'); return; }
  var snap = null;
  try { snap = JSON.parse(raw); } catch (e) {}
  if (!snap || !snap.data) { alert('No safety copy found.'); return; }
  collectAllKeys().forEach(function (k) {
    try { localStorage.removeItem(k); } catch (e) {}
  });
  restoreKeys(snap.data);
  try { localStorage.removeItem(SAFETY_KEY); } catch (e) {}
  document.getElementById('undoBar').classList.remove('show');
  render();
}

document.getElementById('search').addEventListener('input', function (ev) {
  state.q = ev.target.value;
  render();
});
document.getElementById('gearBtn').addEventListener('click', function () {
  location.hash = '#/settings';
});
document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.getElementById('sheetOverlay').addEventListener('click', function (ev) {
  if (ev.target === document.getElementById('sheetOverlay')) { closeSheet(); }
});
document.getElementById('restoreFile').addEventListener('change', function (ev) {
  if (ev.target.files && ev.target.files[0]) restoreFile(ev.target.files[0]);
  ev.target.value = '';
});
document.getElementById('undoRestoreBtn').addEventListener('click', undoRestore);
window.addEventListener('hashchange', route);
window.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && sheetKind) { closeSheet(); }
});

/* Swipe down on the sheet handle to close (mobile bottom sheet). */
(function () {
  var sheet = document.getElementById('sheet');
  var handle = document.getElementById('sheetHandle');
  var startY = null;
  var dy = 0;
  function isMobileSheet() {
    return window.matchMedia && window.matchMedia('(max-width: 640px)').matches;
  }
  handle.addEventListener('touchstart', function (ev) {
    if (!isMobileSheet()) return;
    startY = ev.touches[0].clientY;
    dy = 0;
    sheet.style.transition = 'none';
  });
  handle.addEventListener('touchmove', function (ev) {
    if (startY === null) return;
    dy = ev.touches[0].clientY - startY;
    if (dy > 0) { sheet.style.transform = 'translateY(' + dy + 'px)'; }
  });
  handle.addEventListener('touchend', function () {
    if (startY === null) return;
    sheet.style.transition = '';
    if (dy > 100) { closeSheet(); } else { sheet.style.transform = ''; }
    startY = null;
    dy = 0;
  });
})();

render();
route();

// Register the dashboard service worker so Mini Apps installs as a PWA.
if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
