<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#4338ca"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="icon" type="image/svg+xml" href="./icon.svg"/>
<link rel="apple-touch-icon" href="./icon.svg"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>"/>
<title>ShopPulse — Shop Manager</title>
<style>
:root{
  --primary:#4338ca; --primary-600:#4f46e5; --primary-50:#eef2ff; --primary-100:#e0e7ff;
  --bg:#f1f5f9; --surface:#ffffff; --card:#ffffff; --soft:#f8fafc; --soft2:#eef2f7; --ink:#0f172a;
  --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --track:#cbd5e1;
  --green:#059669; --green-bg:#ecfdf5; --red:#dc2626; --red-bg:#fef2f2;
  --amber:#d97706; --amber-bg:#fffbeb; --radius:14px;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.05);
  --nav-h:62px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --primary-50:#1c2444; --primary-100:#232d54; --primary-600:#6366f1;
  --bg:#0b111e; --surface:#141b2b; --card:#141b2b; --soft:#1a2336; --soft2:#1f2a41; --ink:#e6ebf5;
  --text:#e6ebf5; --muted:#8b95aa; --border:#263149; --track:#3a4664;
  --green:#34d399; --green-bg:#0c2b22; --red:#f87171; --red-bg:#2c1215;
  --amber:#fbbf24; --amber-bg:#2c2409;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;transition:background .25s,color .25s}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
svg{flex-shrink:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--track);border-radius:8px}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh}
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
#view{flex:1;padding:16px;padding-bottom:calc(var(--nav-h) + var(--sab) + 16px);max-width:1280px;width:100%;margin:0 auto;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Sidebar (desktop) ---------- */
#sidebar{display:none;width:240px;background:#0d1526;color:#cbd5e1;flex-direction:column;position:sticky;top:0;height:100vh}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px}
#sidebar .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:grid;place-items:center;font-size:19px}
#sidebar .brand b{color:#fff;font-size:15px;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#sidebar .brand span{font-size:11.5px;color:#94a3b8}
#sidebar nav{flex:1;padding:4px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
#sidebar nav a{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:10px;color:#cbd5e1;font-size:13.5px;font-weight:500;text-decoration:none;white-space:nowrap}
#sidebar nav a svg{opacity:.8}
#sidebar nav a.active{background:var(--primary-600);color:#fff}
#sidebar nav a:not(.active):hover{background:rgba(255,255,255,.07)}
#sidebar .foot{padding:13px 18px;font-size:11px;color:#64748b;border-top:1px solid rgba(255,255,255,.08)}

/* ---------- Topbar ---------- */
#topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;padding-top:calc(10px + var(--sat));display:flex;align-items:center;gap:10px}
#topbar .tb-title{font-size:17px;font-weight:700;flex:1;display:flex;align-items:center;gap:10px;min-width:0}
#topbar .tb-title .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .actions{display:flex;gap:8px;align-items:center}
.theme-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.theme-btn:hover{background:var(--primary-50)}

/* ---------- Bottom nav (mobile) ---------- */
#bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--border);height:calc(var(--nav-h) + var(--sab));padding-bottom:var(--sab)}
#bottomnav .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;text-decoration:none;position:relative}
#bottomnav .bn-item.active{color:var(--primary-600)}
#bottomnav .bn-bill{position:absolute;top:-26px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--primary-600),#7c3aed);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(79,70,229,.4);border:4px solid var(--bg)}
#bottomnav .bn-item span{pointer-events:none}

@media (min-width:1024px){
  #sidebar{display:flex}
  #bottomnav{display:none}
  #topbar{padding:14px 24px}
  #view{padding:24px;padding-bottom:40px}
}

/* ---------- Common ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid transparent;transition:filter .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary-600);color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-outline{border-color:var(--border);background:var(--surface)}
.btn-outline:hover{background:var(--primary-50)}
.btn-ghost{color:var(--primary-600)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn-icon{width:38px;height:38px;padding:0;border-radius:10px}
.input,.select,textarea.input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:16px;outline:none;transition:border .15s}
.input:focus,.select:focus{border-color:var(--primary-600)}
.label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.blue{background:var(--primary-50);color:var(--primary-600)}
.badge.gray{background:var(--soft2);color:var(--muted)}
.section-title{font-size:15px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{opacity:.4;margin-bottom:8px}
.divider{height:1px;background:var(--border);margin:10px 0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{padding:14px 16px;position:relative;overflow:hidden}
.stat .s-label{font-size:12px;font-weight:600;color:var(--muted)}
.stat .s-value{font-size:21px;font-weight:800;margin-top:3px;letter-spacing:-.3px}
.stat .s-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat .s-ico{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
@media (min-width:1024px){.stats{grid-template-columns:repeat(4,1fr)}.stat .s-value{font-size:24px}}
.dgrid{display:grid;gap:14px}
@media (min-width:1024px){.dgrid{grid-template-columns:1fr 1fr}}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:9px 12px;border-bottom:1.5px solid var(--border);white-space:nowrap;background:var(--soft)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover{background:var(--primary-50)}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--primary-50)}
.lrow .l-ic{width:40px;height:40px;border-radius:11px;background:var(--primary-50);color:var(--primary-600);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.lrow .l-main{flex:1;min-width:0}
.lrow .l-t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .l-s{font-size:12px;color:var(--muted)}
.lrow .l-r{text-align:right;flex-shrink:0}

/* ---------- Small screens: keep rows with CTAs inside layout ---------- */
@media (max-width:640px){
  .between{flex-wrap:wrap}
  .section-title{flex-wrap:wrap;row-gap:4px;min-width:0}
  .set-row{flex-wrap:wrap}
  .lrow{flex-wrap:wrap;row-gap:9px}
  .lrow>.btn{flex:1 1 100%;margin-left:52px}
  .lrow>.btn-icon{flex:0 0 auto}
  .lrow>.row{flex:1 1 100%;margin-left:52px;flex-wrap:wrap;row-gap:6px}
  .lrow>.badge{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .l-r{max-width:44%}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #topbar .actions .btn-sm{padding:6px 9px;font-size:12.5px}
}
@media (max-width:420px){
  .m-foot .btn{font-size:12.5px;padding:9px 6px}
  .btn-sm{padding:5px 9px;font-size:12.5px}
  .lrow{padding:12px 13px;gap:10px}
  .lrow>.btn{margin-left:50px}
}

/* POS */
.pos-wrap{display:grid;gap:14px}
@media (min-width:1024px){.pos-wrap{grid-template-columns:1fr 420px}}
@media (max-width:1023px){
  .pos-wrap>.card{order:2;position:static;align-self:auto}
  .pos-wrap{gap:10px}
  .pos-grid{gap:8px}
  #cartArea{max-height:30vh}
  .pos-cartbar{display:flex}
}
.pos-cartbar{display:none;position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--sab) + 14px);z-index:60;background:linear-gradient(135deg,var(--primary-600),#7c3aed);color:#fff;border-radius:14px;padding:11px 14px;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 22px rgba(0,0,0,.32);cursor:pointer;font-weight:700;font-size:13.5px;flex-wrap:wrap}
.pos-cartbar .cb-total{font-size:16px;font-weight:800}
.pos-cartbar .cb-btn{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:9px;padding:7px 12px;font-weight:800;font-size:13px;color:#fff}
.pos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:480px){.pos-grid{grid-template-columns:repeat(3,1fr)}}
.pcell{border:1.5px solid var(--border);border-radius:12px;padding:11px 12px;text-align:left;background:var(--surface);transition:all .12s}
.pcell:hover{border-color:var(--primary-600);background:var(--primary-50)}
.pcell:active{transform:scale(.97)}
.pcell .p-name{font-weight:600;font-size:13px;line-height:1.3;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcell .p-price{font-weight:800;color:var(--primary-600);font-size:14px;margin-top:5px}
.pcell .p-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:3px}
.pcell.oos{opacity:.5}

/* cart */
.cline{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);align-items:center}
.cline:last-child{border-bottom:none}
.qtyctl{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:9px;overflow:hidden;flex-shrink:0}
.qtyctl button{width:30px;height:32px;display:grid;place-items:center;color:var(--primary-600);font-weight:700}
.qtyctl button:active{background:var(--primary-50)}
.qtyctl .qv{width:34px;text-align:center;font-weight:700;border-left:1.5px solid var(--border);border-right:1.5px solid var(--border);height:32px;line-height:32px;font-size:13px}
.qtyctl .qvi{width:56px;text-align:center;font-weight:700;border-left:1.5px solid var(--border);border-right:1.5px solid var(--border);height:32px;font-size:13px;outline:none;border-top:none;border-bottom:none;background:transparent;color:inherit}
.totline{display:flex;justify-content:space-between;font-size:13.5px;padding:3.5px 0}
.totline.grand{font-size:18px;font-weight:800;padding-top:9px;margin-top:6px;border-top:1.5px dashed var(--border)}
.seg{display:flex;background:var(--soft2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--primary-600);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{padding:6px 13px;border-radius:99px;border:1.5px solid var(--border);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;background:var(--surface);flex-shrink:0}
.chip.active{background:var(--primary-600);border-color:var(--primary-600);color:#fff}

/* search */
.search{position:relative}
.search .input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* modal */
#modalWrap{position:fixed;inset:0;z-index:700;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
#modalWrap.hidden{display:none}
#modalCard{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;animation:up .22s ease;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:640px){
  #modalWrap{align-items:center}
  #modalCard{border-radius:16px;animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
}
.m-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border);z-index:2;border-radius:20px 20px 0 0}
.m-head h3{font-size:16px}
.m-body{padding:4px 18px 18px}
.m-foot{position:sticky;bottom:0;background:var(--surface);display:flex;gap:10px;padding:13px 18px;border-top:1px solid var(--border)}
.m-foot .btn{flex:1}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--sab) + 18px);z-index:800;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px);pointer-events:none}
@media (min-width:1024px){#toast{bottom:26px}}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center;animation:tin .25s ease;max-width:100%}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

/* invoice preview */
.inv-preview{font-size:13px}
.inv-preview table{width:100%;border-collapse:collapse;margin:10px 0}
.inv-preview th{background:var(--soft);padding:7px 8px;text-align:left;font-size:11px;border:1px solid var(--border)}
.inv-preview td{padding:7px 8px;border:1px solid var(--border)}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
.tbl-scroll table{margin:0;min-width:540px}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);gap:12px}
.set-row:last-child{border-bottom:none}
.toggle{position:relative;width:46px;height:26px;border-radius:99px;background:var(--track);transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--primary-600)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on::after{left:23px}

/* lock screen */
#lock{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#lock.hidden{display:none}
#lock .lk-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:grid;place-items:center;font-size:30px;box-shadow:0 10px 28px rgba(79,70,229,.35)}
#lock .lk-name{font-size:19px;font-weight:800}
#lock .lk-sub{color:var(--muted);font-size:13px}
#shopPick{position:fixed;inset:0;z-index:600;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
#shopPick.hidden{display:none}
#shopPick .sp-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:grid;place-items:center;font-size:30px;box-shadow:0 10px 28px rgba(79,70,229,.35)}
.sp-ic{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.sp-type{display:flex;gap:10px;align-items:center;padding:10px;border:1.5px solid var(--border);border-radius:12px;cursor:pointer}
.sp-type:has(input:checked){border-color:var(--primary-600);background:var(--primary-50)}
.lk-dots{display:flex;gap:14px;margin:8px 0}
.lk-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--track)}
.lk-dots span.fill{background:var(--primary-600);border-color:var(--primary-600)}
.lk-pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.lk-pad button{height:64px;border-radius:16px;background:var(--surface);border:1px solid var(--border);font-size:22px;font-weight:700;box-shadow:var(--shadow)}
.lk-pad button:active{background:var(--primary-50);transform:scale(.96)}

/* staff attendance grid */
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.att{height:44px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.att .ad{font-size:10px;font-weight:800;letter-spacing:.5px}
.att.P{background:#dcfce7;border-color:#16a34a;color:#14532d}
.att.A{background:#fee2e2;border-color:#dc2626;color:#7f1d1d}
.att.H{background:#fef3c7;border-color:#d97706;color:#78350f}
.att.fut{opacity:.3;pointer-events:none}

/* share / copy modal bits */
.copybox{width:100%;min-height:130px;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:12.5px;background:var(--soft);color:var(--text);white-space:pre-wrap}

/* print */
#printArea{display:none}
/* multi-select checkbox */
.msel{width:26px;height:26px;border-radius:8px;border:2px solid var(--track);display:grid;place-items:center;color:transparent;flex-shrink:0;cursor:pointer;background:var(--surface)}
.msel.on{background:var(--primary-600);border-color:var(--primary-600);color:#fff}
.msel svg{width:14px;height:14px}

/* undo bar */
#undoBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--sab) + 18px);z-index:900;background:var(--ink);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ---------- Utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nf=n=>(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const fmt=n=>'\u20B9'+nf(n);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const niceDate=s=>{const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'2-digit'});};
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};

/* ---------- Units of measure ---------- */
const UOM={pcs:{l:'pcs',s:1,d:0},pkt:{l:'pkt',s:1,d:0},kg:{l:'kg',s:.5,d:2},g:{l:'g',s:100,d:0},l:{l:'L',s:.5,d:2},ml:{l:'ml',s:100,d:0}};
const uomOf=u=>UOM[u]||UOM.pcs;
const fq=(q,u)=>{const uo=uomOf(u);let s=num(q).toFixed(uo.d);if(s.indexOf('.')>-1){s=s.replace(/0+$/,'').replace(/\.$/,'');}return s;};
const fqU=(q,u)=>fq(q,u)+' '+uomOf(u).l;
const ROLE_L={raw:'Raw Material',finished:'Finished Product',byproduct:'Byproduct',service:'Service'};
const stateName=c=>(STATES.find(s=>s[0]===c)||['',''])[1];
const invDue=i=>Math.max(0,i.grandTotal-(i.paid||0)-(i.returnAmount||0));

/* ---------- Number to words (Indian) ---------- */
function numWords(n){
  n=Math.round(n*100)/100;const r=Math.floor(n),p=Math.round((n-r)*100);
  const o=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?o[x]:t[Math.floor(x/10)]+(x%10?' '+o[x%10]:'');
  const three=x=>(x>99?o[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  const w=x=>{if(x>=1e7)return w(Math.floor(x/1e7))+' Crore '+(x%1e7?w(x%1e7):'');if(x>=1e5)return w(Math.floor(x/1e5))+' Lakh '+(x%1e5?w(x%1e5):'');if(x>=1e3)return w(Math.floor(x/1e3))+' Thousand '+(x%1e3?w(x%1e3):'');return three(x);};
  let s=r?(w(r).trim()+' Rupees'):'Zero Rupees';
  if(p)s+=' and '+(p<20?o[p]:t[Math.floor(p/10)]+(p%10?' '+o[p%10]:''))+' Paise';
  return s+' Only';
}

/* ---------- Database ---------- */
const MASTER_KEY='mobidukaan_pro_master';
let master=null; /* {shops:[{id,name,type,dbKey,createdAt}],activeId,customTypes:[{id,name,icon}]} */

function saveMaster(){try{localStorage.setItem(MASTER_KEY,JSON.stringify(master));}catch(e){}}
function activeShop(){return ((master&&master.shops)||[]).find(s=>s.id===master.activeId)||null;}
function save(){try{const s=activeShop();if(s)localStorage.setItem(s.dbKey,JSON.stringify(db));}catch(e){}}

/* ---------- Tax engine ---------- */
function isIntraState(customerId){
  if(db.settings.taxMode!=='auto')return true; /* CGST+SGST by default */
  const cust=db.customers.find(c=>c.id===customerId);
  const custState=cust?cust.state:db.settings.state;
  return custState===db.settings.state;
}
function lineCalc(price,qty,discPct,gstRate,intra){
  const gross=price*qty;
  const disc=gross*discPct/100;
  const net=gross-disc;
  const inc=db.settings.priceIncludesTax;
  const taxable=inc?net*100/(100+gstRate):net;
  const tax=taxable*gstRate/100;
  return{gross,disc,net,taxable,tax,cgst:intra?tax/2:0,sgst:intra?tax/2:0,igst:intra?0:tax,total:inc?net:net+tax};
}
function billTotals(items,customerId){
  const intra=isIntraState(customerId);
  let sub=0,tax=0,cgst=0,sgst=0,igst=0,disc=0,gross=0;
  const rates={};
  items.forEach(it=>{
    const c=lineCalc(it.price,it.qty,it.disc||0,it.gstRate,intra);
    it.taxable=c.taxable;it.tax=c.tax;it.cgst=c.cgst;it.sgst=c.sgst;it.igst=c.igst;it.total=c.total;
    sub+=c.taxable;tax+=c.tax;cgst+=c.cgst;sgst+=c.sgst;igst+=c.igst;disc+=c.disc;gross+=c.total;
    if(it.gstRate>0){const r=rates[it.gstRate]=rates[it.gstRate]||{taxable:0,tax:0};r.taxable+=c.taxable;r.tax+=c.tax;}
  });
  let grand=gross,ro=0;
  if(db.settings.roundOff){grand=Math.round(gross);ro=grand-gross;}
  return{intra,subTotal:sub,taxTotal:tax,cgst,sgst,igst,disc,roundOff:ro,grandTotal:grand,rates};
}

function isoAddDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function setRange(k,f,t){S[k+'From']=f;S[k+'To']=t;render();}
function quickRange(k,mode){
  const t=todayStr();
  if(mode==='month'){S[k+'From']=t.slice(0,7)+'-01';S[k+'To']=t;}
  else if(mode==='7'){S[k+'From']=isoAddDays(t,-6);S[k+'To']=t;}
  else if(mode==='30'){S[k+'From']=isoAddDays(t,-29);S[k+'To']=t;}
  else if(mode==='fy'){const y=Number(t.slice(0,4));const fy=Number(t.slice(5,7))>=4?y:y-1;S[k+'From']=fy+'-04-01';S[k+'To']=t;}
  else{S[k+'From']='';S[k+'To']='';}
  render();
}

function go(view,arg){
  if(view==='pos'&&!S.pos)S.pos=freshPos();
  const BACKABLE=['invoice','customer','estimate','staffDetail','purchaseForm'];
  if(BACKABLE.includes(view)&&!BACKABLE.includes(S.view)&&!['invoice','customer','estimate','staffDetail'].includes(S.view)){
    S.backStack=(S.backStack||[]).concat([{view:S.view,currentInvoice:S.currentInvoice,currentCustomer:S.currentCustomer,currentEmp:S.currentEmp,currentEstimate:S.currentEstimate}]);
    if(S.backStack.length>10)S.backStack.shift();
  }
  if(view==='invoice')S.currentInvoice=arg;
  if(view==='customer')S.currentCustomer=arg;
  if(view==='estimate')S.currentEstimate=arg;
  if(view==='staffDetail')S.currentEmp=arg;
  if(view==='purchases'&&arg==='new'){S.pur=freshPur();view='purchaseForm';}
  const MULTI_VIEWS=['expenses','invoices','estimates','customers','suppliers','purchases','returns','staff','inventory'];
  if(S.multi&&S.multi.view&&!MULTI_VIEWS.includes(view))S.multi={view:null,ids:[]};
  S.view=view;render();syncHash(view,['invoice','customer','estimate','staffDetail'].includes(view)?arg:null);
  window.scrollTo(0,0);
}
function applyBack(){
  const st=(S.backStack||[]).pop();
  if(!st){S.backStack=[];S.view='dashboard';render();return;}
  S.currentInvoice=st.currentInvoice||null;
  S.currentCustomer=st.currentCustomer||null;
  S.currentEmp=st.currentEmp||null;
  S.currentEstimate=st.currentEstimate||null;
  S.view=st.view;render();
  window.scrollTo(0,0);
}
function goBack(){
  try{
    if(window.history&&window.history.back&&window.location&&window.location.hash!==undefined&&S.backStack&&S.backStack.length){window.history.back();return;}
  }catch(e){}
  applyBack();
}
/* ---------- Hash routing: browser back/forward + bookmarkable URLs ---------- */
function parseHash(){
  try{
    const h=(window.location&&window.location.hash||'').replace(/^#\/?/,'');
    const p=h.split('/');
    const v=p[0]||'',a=p[1]?decodeURIComponent(p[1]):null;
    if(VIEW_META[v])return{view:v,arg:a};
  }catch(e){}
  return null;
}
function syncHash(view,arg){
  try{
    if(!window.location||window.location.hash===undefined)return;
    const h='#/'+view+(arg?'/'+encodeURIComponent(arg):'');
    if(window.location.hash!==h){S.hashNav=(S.hashNav||0)+1;window.location.hash=h;}
  }catch(e){}
}
function navFromHash(r){
  const MULTI_VIEWS=['expenses','invoices','estimates','customers','suppliers','purchases','returns','staff','inventory'];
  if(S.multi&&S.multi.view&&!MULTI_VIEWS.includes(r.view))S.multi={view:null,ids:[]};
  if(r.view==='pos'&&!S.pos)S.pos=freshPos();
  if(r.view==='invoice')S.currentInvoice=r.arg;
  if(r.view==='customer')S.currentCustomer=r.arg;
  if(r.view==='estimate')S.currentEstimate=r.arg;
  if(r.view==='staffDetail')S.currentEmp=r.arg;
  S.view=r.view;render();
}
function applyHashRoute(){
  if((S.hashNav||0)>0){S.hashNav--;return;}
  const r=parseHash();if(!r)return;
  const st=(S.backStack||[])[S.backStack.length-1];
  if(st&&st.view===r.view){applyBack();return;} // browser Back to the list we came from
  navFromHash(r); // forward navigation or bookmarked hash
}

/* ---------- RBAC: Roles & Access ---------- */
const RBAC_MODULES=[['pos','New Bill (POS)'],['inventory','Inventory'],['invoices','Invoices'],['estimates','Estimates'],['returns','Sale Returns'],['customers','Customers'],['staff','Staff & Payroll'],['purchases','Purchases'],['production','Production'],['jobwork','Job Work'],['expenses','Expenses'],['suppliers','Suppliers'],['daybook','Day Book'],['pl','Profit & Loss'],['reports','Reports']];
function isOwner(){return !S.user||S.user.type==='owner';}
function curRole(){if(isOwner())return null;return (db.roles||[]).find(r=>r.id===(S.user&&S.user.roleId))||null;}
function moduleOf(view){return{invoice:'invoices',estimate:'estimates',customer:'customers',staffDetail:'staff',purchaseForm:'purchases'}[view]||view;}
function permOf(view){if(isOwner())return 2;const r=curRole();return (r&&r.modules&&r.modules[moduleOf(view)])||0;}
function canAccess(view){if(view==='dashboard')return true;if(view==='settings')return isOwner();return permOf(view)>0;}
function needEdit(view){if(permOf(view)>=2)return true;toast('Your role has view-only access to '+((VIEW_META[view]||['this module'])[0]),'err');return false;}
function needOwner(){if(isOwner())return true;toast('Only the shop owner can do this','err');return false;}
function userRolesOn(){return db&&db.settings&&db.settings.rbacOn!==false&&(db.roles||[]).length>0&&(db.employees||[]).some(e=>e.roleId);}
function roleName(rid){const r=(db.roles||[]).find(x=>x.id===rid);return r?r.name:'No role';}
function showUserPicker(){
  const emps=(db.employees||[]).filter(e=>e.active!==false&&e.roleId);

}
function pickUser(type,eid){

}

function saveRole(id){
  if(!needOwner())return;
  const name=($('#ro_name')?$('#ro_name').value:'').trim();
  if(!name){toast('Enter role name','err');return;}
  const modules={};
  RBAC_MODULES.forEach(md=>{const v=$('#rv_'+md[0]),e=$('#re_'+md[0]);modules[md[0]]=(e&&e.checked)?2:((v&&v.checked)?1:0);});
  db.roles=db.roles||[];
  if(id){const r=db.roles.find(x=>x.id===id);if(r){r.name=name;r.modules=modules;}}
  else db.roles.push({id:uid(),name,modules,createdAt:Date.now()});
  save();closeModal();render();toast('Role saved','ok');
}
function deleteRole(id){
  const r=(db.roles||[]).find(x=>x.id===id);if(!r)return;
  if(!needOwner())return;
  askConfirm('Delete role <b>'+esc(r.name)+'</b>? Employees with this role lose app access until reassigned.',()=>{
    pushUndo('Role "'+r.name+'"');
    db.roles=db.roles.filter(x=>x.id!==id);
    db.employees.forEach(e=>{if(e.roleId===id)e.roleId='';});
    save();closeModal();render();toast('Role deleted','ok');
  },'Delete');
}

/* ---------- Toast / Modal / Links ---------- */
function toast(msg,type){
  const t=document.createElement('div');t.className='toast '+(type||'');
  t.innerHTML=(type==='ok'?I.check:I.alert)+'<span>'+esc(msg)+'</span>';
  $('#toast').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320);},2400);
}
function openModal(title,body,foot){

/* ---------- In-app confirm (confirm() is blocked in preview iframes) ---------- */
let __confirmCb=null;
function askConfirm(msg,cb,btnLabel){
  __confirmCb=cb;
  openModal('Please Confirm',`<div style="padding:8px 0 2px;font-size:14.5px;line-height:1.5">${msg}</div>`,

}

/* ---------- Undo (snapshot before destructive actions) ---------- */
let UNDO_STACK=[];
function pushUndo(label,extra){
  try{
    const s=activeShop();
    UNDO_STACK.push(Object.assign({label,shopId:s?s.id:'',db:JSON.parse(JSON.stringify(db)),master:JSON.parse(JSON.stringify(master))},extra||{}));
    if(UNDO_STACK.length>5)UNDO_STACK.shift();
    const b=document.getElementById('undoBar');
    if(b){b.innerHTML=`<span class="small">${esc(label)} — deleted. <b>Mistake?</b></span><button class="btn btn-sm" style="background:#fff;color:var(--ink);font-weight:700" onclick="doUndo()">${I.undo} Undo</button>`;b.classList.add('show');clearTimeout(pushUndo.t);pushUndo.t=setTimeout(()=>b.classList.remove('show'),8000);}
  }catch(e){}
}
function doUndo(){
  if(!needOwner())return;
  const b=document.getElementById('undoBar');if(b)b.classList.remove('show');
  const u=UNDO_STACK.pop();
  if(!u){toast('Nothing left to undo','err');return;}
  if(u.shopRaw&&u.shopRaw.val!=null){try{localStorage.setItem(u.shopRaw.key,u.shopRaw.val);}catch(e){}}
  if(u.master){master=u.master;saveMaster();}
  const s=activeShop();
  if(!s||s.id!==u.shopId){db=u.db;save();S.multi={view:null,ids:[]};render();toast('Restored: '+u.label,'ok');return;}
  db=u.db;
  save();S.multi={view:null,ids:[]};render();
  toast('Restored: '+u.label,'ok');
}

/* ---------- Multi-select & bulk delete ---------- */
function multiOn(view){return !!(S.multi&&S.multi.view===view);}
function multiToggle(view){S.multi=multiOn(view)?{view:null,ids:[]}:{view:view,ids:[]};render();}
function multiClear(){S.multi={view:null,ids:[]};render();}
function multiTap(view,id){if(!multiOn(view))return;const i=S.multi.ids.indexOf(id);if(i>-1)S.multi.ids.splice(i,1);else S.multi.ids.push(id);render();}
function multiAll(view,ids){if(!multiOn(view))return;S.multi.ids=S.multi.ids.length===ids.length?[]:[...ids];render();}
function multiSelHTML(view,id){return `<div class="msel ${S.multi.ids.includes(id)?'on':''}" onclick="event.stopPropagation();multiTap('${view}','${id}')">${I.check}</div>`;}
function multiBarHTML(view,ids,unit){
  const on=multiOn(view);const n=on?S.multi.ids.length:0;
  return `<div class="card" style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px">
    <button class="btn btn-outline btn-sm" onclick="multiToggle('${view}')">${on?I.close+' Done':I.check+' Select'}</button>
    ${on?`<button class="btn btn-outline btn-sm" onclick="multiAll('${view}',${JSON.stringify(ids)})">${n===ids.length&&ids.length?'Deselect all':'Select all'}</button>
    <b class="small">${n} selected</b>
    <button class="btn btn-sm" style="background:var(--red);color:#fff;margin-left:auto;${n?'':'opacity:.5;pointer-events:none'}" onclick="multiDelete('${view}')">${I.trash} Delete Selected${n?' ('+n+')':''}</button>`:''}
  </div>`;
}
function multiDelete(view){
  const ids=[...(S.multi.ids||[])];
  if(!ids.length)return;
  const units={expenses:'expense',invoices:'bill',estimates:'estimate',products:'product',customers:'customer',suppliers:'supplier',purchases:'purchase',returns:'return',staff:'employee'};
  askConfirm(`Delete <b>${ids.length}</b> ${units[view]||'record'}(s)?<br><span class="small muted">A backup snapshot is kept — you can Undo right after.</span>`,()=>{bulkDelete(view,ids);},'Delete');
}
function bulkDelete(view,ids){
  if(!needEdit(view))return;
  if(!ids.length)return;
  pushUndo(ids.length+' '+(view==='staff'?'employee(s)':view));
  switch(view){
    case 'expenses': db.expenses=db.expenses.filter(x=>!ids.includes(x.id)); break;
    case 'estimates': db.estimates=db.estimates.filter(x=>!ids.includes(x.id)); break;
    case 'products': db.products=db.products.filter(x=>!ids.includes(x.id)); break;
    case 'suppliers': db.suppliers=db.suppliers.filter(x=>!ids.includes(x.id)); break;
    case 'customers':
      ids.forEach(id=>{db.invoices.forEach(i=>{if(i.customerId===id)i.customerId='';});});
      db.customers=db.customers.filter(x=>!ids.includes(x.id));
      break;
    case 'invoices':
      ids.forEach(id=>{
        const i=db.invoices.find(x=>x.id===id);if(!i)return;
        db.returns.filter(r=>r.invoiceId===id).forEach(r=>r.items.forEach(it=>{const p=db.products.find(x=>x.id===it.pid);if(p)p.stock=Math.round((p.stock-it.qty*(it.contains||1))*1000)/1000;}));
        i.items.forEach(it=>{const p=db.products.find(x=>x.id===it.pid);if(p&&p.role!=='service')p.stock=Math.round((p.stock+it.qty*(it.contains||1))*1000)/1000;});
        db.returns=db.returns.filter(r=>r.invoiceId!==id);
        db.payments=db.payments.filter(p=>p.refId!==id);
      });
      db.invoices=db.invoices.filter(x=>!ids.includes(x.id));
      if(S.currentInvoice&&ids.includes(S.currentInvoice))S.currentInvoice=null;
      break;
    case 'returns':
      ids.forEach(id=>{
        const r=db.returns.find(x=>x.id===id);if(!r)return;
        r.items.forEach(it=>{const p=db.products.find(x=>x.id===it.pid);if(p)p.stock=Math.round((p.stock-it.qty*(it.contains||1))*1000)/1000;});
        const inv=invOf(r.invoiceId);
        if(inv&&r.mode==='Adjust from Dues')inv.returnAmount=Math.max(0,(inv.returnAmount||0)-r.refund);
      });
      db.returns=db.returns.filter(x=>!ids.includes(x.id));
      break;
    case 'purchases':
      ids.forEach(id=>{
        const p=db.purchases.find(x=>x.id===id);if(!p)return;
        p.items.forEach(it=>{const pr=db.products.find(x=>x.id===it.pid);if(pr)pr.stock=Math.round((pr.stock-it.qty)*1000)/1000;});
      });
      db.purchases=db.purchases.filter(x=>!ids.includes(x.id));
      break;
    case 'staff':
      db.employees=db.employees.filter(x=>!ids.includes(x.id));
      db.attendance=db.attendance.filter(a=>!ids.includes(a.eid));
      db.payroll=db.payroll.filter(p=>!ids.includes(p.eid));
      if(S.currentEmp&&ids.includes(S.currentEmp)){S.currentEmp=null;if(S.view==='staffDetail')S.view='staff';}
      break;
  }
  S.multi={view:null,ids:[]};
  save();render();toast(ids.length+' record(s) deleted — Undo available','ok');
}
document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal();});

function openLink(url){
  try{
    const a=document.createElement('a');
    a.href=url;a.target='_blank';a.rel='noopener';
    document.body.appendChild(a);a.click();a.remove();

function copyText(txt){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt);return true;}
  }catch(e){}
  try{
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();return true;
  }catch(e){return false;}
}

function vDashboard(){

function chart7(){
  const sales={};db.invoices.forEach(i=>sales[i.date]=(sales[i.date]||0)+i.grandTotal);
  db.returns.forEach(r=>sales[r.date]=(sales[r.date]||0)-r.refund);
  const days=[];
  for(let d=6;d>=0;d--){const dt=new Date();dt.setDate(dt.getDate()-d);
    const ds=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    days.push({label:dt.toLocaleDateString('en-IN',{weekday:'short'}),v:Math.max(0,sales[ds]||0),date:ds});}
  const max=Math.max(...days.map(d=>d.v),1);
  return `<div style="display:flex;gap:6px;align-items:flex-end;height:150px">
  ${days.map(d=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end">
    <div class="small muted mono" style="font-size:10px">${d.v?Math.round(d.v/1000)+'k':''}</div>
    <div title="${d.date}: ${fmt(d.v)}" style="width:100%;max-width:44px;background:${d.v?'linear-gradient(180deg,var(--primary-600),#818cf8)':'var(--soft2)'};border-radius:6px 6px 3px 3px;height:${Math.max(d.v/max*100,d.v?8:2.5)}%;cursor:pointer" onclick="go('invoices')"></div>
    <div class="small muted" style="font-size:10.5px;font-weight:600">${d.label}</div>
  </div>`).join('')}</div>`;
}
function topProductsHTML(days,limit){
  const from=new Date();from.setDate(from.getDate()-days);
  const agg={};
  db.invoices.forEach(inv=>{if(new Date(inv.date+'T00:00:00')<from)return;
    inv.items.forEach(it=>{const a=agg[it.pid]=agg[it.pid]||{name:it.name,qty:0,amt:0};a.qty+=it.qty;a.amt+=it.total;});});
  const rows=Object.values(agg).sort((a,b)=>b.amt-a.amt).slice(0,limit);
  if(!rows.length)return `<div class="empty" style="padding:22px">${I.box}<div>No sales in this period</div></div>`;
  const max=rows[0].amt;
  return rows.map((r,i)=>`<div class="lrow" style="cursor:default"><div class="l-ic" style="background:var(--soft2);color:var(--muted)">${i+1}</div>
  <div class="l-main"><div class="l-t">${esc(r.name)}</div><div style="background:var(--soft2);border-radius:99px;height:6px;margin-top:5px"><div style="width:${r.amt/max*100}%;height:100%;background:var(--primary-600);border-radius:99px"></div></div></div>
  <div class="l-r"><div class="l-t mono" style="font-size:13px">${fmt(r.amt)}</div><div class="l-s">${r.qty} sold</div></div></div>`).join('');
}

function posScrollToCart(){const c=document.getElementById('posCartCard');if(c)c.scrollIntoView({behavior:'smooth',block:'start'});}

function filteredProducts(){
  const q=(S.posQuery||'').toLowerCase();
  return db.products.filter(p=>{
    if(S.posCat&&p.category!==S.posCat)return false;
    if(!q)return true;
    return p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||(p.barcode||'').includes(q)||(p.brand||'').toLowerCase().includes(q);
  });
}
function posCellHTML(p,packIdx){
  const pk=packIdx>=0?(p.packs||[])[packIdx]:null;
  const price=pk?pk.price:p.price;
  const stockPkts=pk?Math.floor(p.stock/pk.qty):0;
  const oos=p.role!=='service'&&(pk?stockPkts<=0:p.stock<=0);
  const stockTxt=p.role==='service'?'service':pk?stockPkts+' pack(s) left':fq(p.stock,p.unit)+' '+uomOf(p.unit).l+' left';
  const low=p.role!=='service'&&(pk?stockPkts<=p.lowStock:p.stock<=p.lowStock);
  return `<button class="pcell ${oos?'oos':''}" onclick="addToCart('${p.id}',${packIdx})">
    <div class="p-name">${esc(p.name)}${pk?' · <b>'+esc(pk.label)+'</b>':''}</div>
    <div class="p-price mono">${fmt(price)}${pk?'':p.role==='service'?'':'/'+uomOf(p.unit).l}</div>
    <div class="p-meta"><span>GST ${p.gstRate}%</span><span style="color:${low?'var(--red)':'inherit'};font-weight:700">${stockTxt}</span></div>
  </button>`;
}
function posCellsHTML(){
  const prods=filteredProducts().slice(0,30);

  return prods.map(p=>{let out=posCellHTML(p,-1);(p.packs||[]).forEach((pk,ix)=>{out+=posCellHTML(p,ix);});return out;}).join('');

function posEnter(q){
  q=q.trim();if(!q)return;
  const p=db.products.find(x=>x.barcode===q)||db.products.find(x=>x.sku.toLowerCase()===q.toLowerCase())||filteredProducts()[0];
  if(p){addToCart(p.id);const el=$('#posSearch');if(el){el.value='';S.posQuery='';refreshPosGrid();}}

}
function addToCart(pid,packIdx){
  const p=db.products.find(x=>x.id===pid);if(!p)return;
  packIdx=(packIdx===undefined||packIdx===null)?-1:parseInt(packIdx,10);
  const pk=packIdx>=0?(p.packs||[])[packIdx]:null;
  const packLabel=pk?pk.label:'';
  const price=pk?pk.price:p.price;
  const contains=pk?pk.qty:1;
  const ex=S.pos.items.find(it=>it.pid===pid&&(it.packLabel||'')===packLabel);
  if(ex)ex.qty++;
  else S.pos.items.push({pid,name:pk?p.name+' ('+pk.label+')':p.name,hsn:p.hsn,sku:p.sku,unit:p.unit||'pcs',price,qty:1,disc:0,gstRate:p.gstRate,contains,packLabel});
  renderCart();
}
function chQty(i,d){const it=S.pos.items[i];if(!it)return;it.qty=Math.round((it.qty+d)*1000)/1000;if(it.qty<=0)S.pos.items.splice(i,1);renderCart();}
function chQtySet(i,v){const it=S.pos.items[i];if(!it)return;const mn=uomOf(it.unit||'pcs').d>0?0.01:1;it.qty=Math.max(mn,num(v));if(it.qty<=0)S.pos.items.splice(i,1);renderCart();}
function chDisc(i,v){const it=S.pos.items[i];if(it){it.disc=Math.max(0,Math.min(100,num(v)));renderCart();}}
function chPrice(i,v){const it=S.pos.items[i];if(it){it.price=Math.max(0,num(v));renderCart();}}
function rmLine(i){S.pos.items.splice(i,1);renderCart();}

function updChange(){

function saveInvoice(print){
  if(!needEdit('pos'))return;
  if(!S.pos.items.length){toast('Cart is empty','err');return;}
  if(S.pos.payMode==='Credit'&&!S.pos.customerId){toast('Select a customer for credit bills','err');return;}
  const T=billTotals(S.pos.items,S.pos.customerId);
  db.counters.invoice=(db.counters.invoice||0)+1;
  const no=db.settings.invoicePrefix+String(db.counters.invoice).padStart(4,'0');
  const cust=db.customers.find(c=>c.id===S.pos.customerId);
  const emp=empOf(S.pos.empId||'');
  let paid;
  if(S.pos.payMode==='Credit')paid=0;
  else{paid=num(S.pos.paidInput)||T.grandTotal;if(paid>T.grandTotal)paid=T.grandTotal;}
  if(cust&&num(cust.creditLimit)>0){
    const newDue=Math.max(0,T.grandTotal-paid);
    const curDue=custDues(cust.id);
    if(newDue>0.5&&curDue+newDue>num(cust.creditLimit)+0.5){
      toast('Credit limit exceeded for '+cust.name+'! Dues '+fmt(curDue)+' + this bill '+fmt(newDue)+' > limit '+fmt(num(cust.creditLimit)),'err');
      return;
    }
  }
  const inv={id:uid(),no,date:todayStr(),time:nowTime(),customerId:S.pos.customerId,customerName:cust?cust.name:'Walk-in Customer',empId:emp?emp.id:'',empName:emp?emp.name:'',
    items:S.pos.items.map(it=>({pid:it.pid,name:it.name,hsn:it.hsn,sku:it.sku||'',unit:it.unit||'pcs',price:it.price,qty:it.qty,disc:it.disc||0,gstRate:it.gstRate,contains:it.contains||1,packLabel:it.packLabel||'',taxable:it.taxable,tax:it.tax,cgst:it.cgst,sgst:it.sgst,igst:it.igst,total:it.total})),
    subTotal:T.subTotal,taxTotal:T.taxTotal,cgst:T.cgst,sgst:T.sgst,igst:T.igst,roundOff:T.roundOff,grandTotal:T.grandTotal,
    payMode:S.pos.payMode,paid,notes:S.pos.notes,returnAmount:0,createdAt:Date.now()};
  let negWarn=false,expWarn=null;
  inv.items.forEach(it=>{const p=db.products.find(x=>x.id===it.pid);if(p&&p.role!=='service'){const units=it.qty*(it.contains||1);p.stock=Math.round((p.stock-units)*1000)/1000;if(p.stock<0)negWarn=true;const ex=deductBatches(p,units);if(ex&&!expWarn)expWarn=ex;}});
  db.invoices.push(inv);
  if(paid>0.5)db.payments.push({id:uid(),date:inv.date,time:inv.time,type:'sale',refId:inv.id,refNo:no,customerId:inv.customerId,customerName:inv.customerName,amount:paid,mode:inv.payMode,note:'Bill payment'});
  if(S.pos.estId){const es=estOf(S.pos.estId);if(es&&es.status!=='converted'){es.status='converted';es.invoiceNo=no;}}
  save();
  S.pos=freshPos();
  toast('Saved '+no+(negWarn?' (stock went negative!)':'')+(expWarn?' — batch expiring '+niceDate(expWarn)+' used (FEFO)':''),'ok');
  go('invoice',inv.id);
  if(print)setTimeout(()=>openPrintPreview(inv.id),400);
}

function renderPackRows(pid){
  const p=db.products.find(x=>x.id===pid);const el=document.getElementById('pk_rows');if(!el||!p)return;

}
function openBatchModal(pid){
  const p=db.products.find(x=>x.id===pid);if(!p)return;
  if(!p.batches)p.batches=[];
  openModal('Batches & Expiry — '+esc(p.name),`
    <div class="small muted">Stock: ${fq(p.stock,p.unit)} ${uomOf(p.unit).l}. Adding a batch also increases stock. Sales deduct batches FEFO (First-Expiry-First-Out).</div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap">
      <input id="bt_qty" class="input" type="number" inputmode="decimal" style="flex:1;min-width:90px" placeholder="Qty (${uomOf(p.unit).l})" min="0" step="0.01">
      <input id="bt_exp" class="input" type="date" style="flex:1;min-width:130px">
      <button class="btn btn-primary btn-sm" onclick="addBatch('${p.id}')">${I.plus}</button>
    </div>
    <div id="bt_rows" style="margin-top:10px"></div>
  `,`<button class="btn btn-primary" onclick="closeModal();render()">${I.check} Done</button>`);
  renderBatRows(pid);
}
function addBatch(pid){
  const p=db.products.find(x=>x.id===pid);if(!p)return;
  const q=num(document.getElementById('bt_qty').value);
  const exp=document.getElementById('bt_exp').value||'';
  if(q<=0){toast('Enter batch quantity','err');return;}
  if(!exp){toast('Pick expiry date (far date for non-expiring goods)','err');return;}
  p.batches.push({qty:q,expiry:exp});
  p.stock=Math.round((p.stock+q)*1000)/1000;
  save();renderBatRows(pid);
}
function rmBatch(pid,i){
  const p=db.products.find(x=>x.id===pid);if(!p)return;
  const b=p.batches[i];if(!b)return;
  p.stock=Math.round((p.stock-b.qty)*1000)/1000;p.batches.splice(i,1);save();renderBatRows(pid);
}
function renderBatRows(pid){
  const p=db.products.find(x=>x.id===pid);const el=document.getElementById('bt_rows');if(!el||!p)return;
  el.innerHTML=(p.batches||[]).length?`<div class="card">${p.batches.map((b,i)=>{const d=daysToExpiry(b.expiry);return`
    <div class="lrow">
      <div class="l-ic" style="${d<0?'background:var(--red);color:#fff':d<=30?'background:var(--amber);color:#fff':''}">${d<0?'!':d<=30?I.clock:I.check}</div>
      <div class="l-main"><div class="l-t">${fq(b.qty,p.unit)} ${uomOf(p.unit).l}</div><div class="l-s">Expires ${niceDate(b.expiry)}</div></div>
      <div class="l-r">${d<0?'<span class="badge red">Expired</span>':d<=30?`<span class="badge amber">${d} day(s) left</span>`:`<span class="badge green">${d} day(s)</span>`}</div>
      <button class="btn-icon btn-outline" style="width:34px;height:34px;color:var(--red)" onclick="rmBatch('${pid}',${i})">${I.trash}</button>
    </div>`;}).join('')}</div>`:`<div class="small muted" style="padding:6px 2px">No batches tracked yet.</div>`;
}
function daysToExpiry(d){
  if(!d)return 99999;
  return Math.round((new Date(d+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
}
function expiringSoon(p){return (p.batches||[]).some(b=>{const d=daysToExpiry(b.expiry);return d>=0&&d<=30;});}
function deductBatches(p,q){
  if(!p.batches||!p.batches.length||q<=0)return null;
  let warn=null,rem=q;
  p.batches.sort((a,b)=>(a.expiry||'9999-12-31').localeCompare(b.expiry||'9999-12-31'));
  for(const b of p.batches){
    if(rem<=0)break;
    const use=Math.min(b.qty,rem);
    if(use>0){b.qty=Math.round((b.qty-use)*1000)/1000;rem-=use;const d=daysToExpiry(b.expiry);if(d>=0&&d<=30&&!warn)warn=b.expiry;}
  }
  p.batches=p.batches.filter(b=>b.qty>0.0005);
  return warn;
}

function exportProductsCSV(){

function recordPayment(id){
  if(!needEdit('invoices'))return;
  const i=invOf(id);const due=invDue(i);
  openModal('Collect Payment — '+esc(i.no),`
    <div class="small muted">Balance due: <b style="color:var(--amber)">${fmt(due)}</b> · Customer: <b>${esc(i.customerName)}</b></div>
    <label class="label">Amount Received</label><input id="pay_amt" class="input" type="number" value="${due}">
    <label class="label">Payment Mode</label>
    <select id="pay_mode" class="select"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option></select>
  `,`<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doRecordPayment('${id}')">${I.check} Record Payment</button>`);
}
function doRecordPayment(id){
  const i=invOf(id);const amt=num($('#pay_amt').value);
  if(amt<=0){toast('Enter amount','err');return;}
  const applied=Math.min(amt,Math.max(0,i.grandTotal-(i.paid||0)-(i.returnAmount||0)));
  i.paid=Math.min(i.grandTotal,(i.paid||0)+amt);
  i.payMode=$('#pay_mode').value;
  if(applied>0.5)db.payments.push({id:uid(),date:todayStr(),time:nowTime(),type:'collect',refId:i.id,refNo:i.no,customerId:i.customerId,customerName:i.customerName,amount:applied,mode:i.payMode,note:'Due collection'});
  save();closeModal();render();toast('Payment recorded','ok');
}
function deleteInvoice(id){
  if(!needEdit('invoices'))return;
  const i=invOf(id);if(!i)return;
  askConfirm('Delete bill <b>'+i.no+'</b>? Stock will be restored (minus any returned items), and its payments/returns removed.',()=>{
    pushUndo('Bill '+i.no);
    db.returns.filter(r=>r.invoiceId===id).forEach(r=>r.items.forEach(it=>{const p=db.products.find(x=>x.id===it.pid);if(p)p.stock=Math.round((p.stock-it.qty*(it.contains||1))*1000)/1000;}));
    i.items.forEach(it=>{const p=db.products.find(x=>x.id===it.pid);if(p&&p.role!=='service')p.stock=Math.round((p.stock+it.qty*(it.contains||1))*1000)/1000;});
    db.invoices=db.invoices.filter(x=>x.id!==id);
    db.returns=db.returns.filter(r=>r.invoiceId!==id);
    db.payments=db.payments.filter(p=>p.refId!==id);
    save();S.currentInvoice=null;go('invoices');toast('Bill deleted, stock restored','ok');
  },'Delete Bill');
}

function prodAdd(kind){
  const P=S.prod;
  const pid=$(kind==='in'?'#pin_sel':'#pout_sel').value;
  const q=num($(kind==='in'?'#pin_qty':'#pout_qty').value);
  const p=db.products.find(x=>x.id===pid);
  if(!p){toast('Select a product','err');return;}
  if(q<=0){toast('Enter quantity','err');return;}
  const arr=kind==='in'?P.inputs:P.outputs;
  const ex=arr.find(x=>x.pid===pid);
  if(kind==='in'){if(ex)ex.qty+=q;else arr.push({pid,name:p.name,qty:q,unit:p.unit||'pcs',cost:p.purchasePrice||0});}
  else{if(ex)ex.qty+=q;else arr.push({pid,name:p.name,qty:q,unit:p.unit||'pcs',price:p.price||0,cost:0});}
  renderProdRows();
}
function prodQty(kind,i,v){const arr=kind==='in'?S.prod.inputs:S.prod.outputs;const it=arr[i];if(it){it.qty=Math.max(0.01,num(v));renderProdRows();}}
function prodRm(kind,i){(kind==='in'?S.prod.inputs:S.prod.outputs).splice(i,1);renderProdRows();}
function renderProdRows(){
  const ri=$('#pin_rows'),ro=$('#pout_rows');if(!ri)return;
  const P=S.prod;
  ri.innerHTML=P.inputs.map((x,i)=>`<div class="row" style="margin-top:6px;gap:6px">
    <div style="flex:1;min-width:0"><b style="font-size:13.5px">${esc(x.name)}</b><div class="small muted">${fmt(x.cost)}/${uomOf(x.unit).l}</div></div>
    <input class="input" style="width:90px;padding:5px 8px;font-size:13px" type="number" min="0.01" step="0.01" value="${x.qty}" onchange="prodQty('in',${i},this.value)">
    <button class="btn btn-danger btn-sm" style="padding:5px 9px" onclick="prodRm('in',${i})">${I.trash}</button>
  </div>`).join('')||`<div class="small muted" style="padding:6px 0">No raw materials added yet</div>`;
  ro.innerHTML=P.outputs.map((x,i)=>`<div class="row" style="margin-top:6px;gap:6px">
    <div style="flex:1;min-width:0"><b style="font-size:13.5px">${esc(x.name)}</b><div class="small muted">${fmt(x.price||0)}/${uomOf(x.unit).l} retail</div></div>
    <input class="input" style="width:90px;padding:5px 8px;font-size:13px" type="number" min="0.01" step="0.01" value="${x.qty}" onchange="prodQty('out',${i},this.value)">
    <button class="btn btn-danger btn-sm" style="padding:5px 9px" onclick="prodRm('out',${i})">${I.trash}</button>
  </div>`).join('')||`<div class="small muted" style="padding:6px 0">No outputs added yet — add oil / powder / flour products</div>`;
  prodSum();
}
function prodTotals(){
  const P=S.prod;
  const inputCost=P.inputs.reduce((a,x)=>a+x.qty*(x.cost||0),0);
  const labour=num(P.labour),power=num(P.power);
  const total=inputCost+labour+power;
  const outVal=P.outputs.reduce((a,x)=>a+x.qty*(x.price||0),0);
  return{inputCost,labour,power,total,outVal};
}
function prodSum(){
  const el=$('#prodSum');if(!el||!S.prod)return;
  const t=prodTotals();
  const lines=S.prod.outputs.map(x=>{const share=t.outVal>0?t.total*(x.qty*(x.price||0))/t.outVal:0;const per=x.qty>0?share/x.qty:0;return `${esc(x.name)}: cost ≈ <b>${fmt(per)}/${uomOf(x.unit).l}</b>`;}).join('<br>');
  el.innerHTML=`Raw cost <b>${fmt(t.inputCost)}</b> + labour/power <b>${fmt(t.labour+t.power)}</b> = <b style="color:var(--primary-600)">${fmt(t.total)}</b><br>Output retail value: <b>${fmt(t.outVal)}</b>${lines?'<br>'+lines:''}`;
}
function saveProdBatch(){
  if(!needEdit('production'))return;
  const P=S.prod;
  if(!P.inputs.length){toast('Add at least one raw material','err');return;}
  if(!P.outputs.length){toast('Add at least one output product','err');return;}
  db.counters.production=(db.counters.production||0)+1;
  const t=prodTotals();
  const outputs=P.outputs.map(x=>{const share=t.outVal>0?t.total*(x.qty*(x.price||0))/t.outVal:0;return{pid:x.pid,name:x.name,qty:x.qty,unit:x.unit,value:x.qty*(x.price||0),cost:share};});
  const b={id:uid(),no:db.settings.prodPrefix+String(db.counters.production).padStart(4,'0'),date:P.date||todayStr(),
    inputs:P.inputs.map(x=>({...x})),outputs,inputCost:t.inputCost,labour:t.labour,power:t.power,totalCost:t.total,outputValue:t.outVal,
    notes:P.notes||'',createdAt:Date.now()};
  let negWarn=false;
  b.inputs.forEach(x=>{const p=db.products.find(y=>y.id===x.pid);if(p){p.stock-=x.qty;if(p.stock<0)negWarn=true;}});
  b.outputs.forEach(x=>{const p=db.products.find(y=>y.id===x.pid);if(p){p.stock+=x.qty;if(P.updCost&&x.qty>0){const per=Math.round((x.cost/x.qty)*100)/100;if(per>0)p.purchasePrice=per;}}});
  db.production.push(b);
  save();S.prod=null;closeModal();render();
  toast('Batch saved — stock updated'+(negWarn?' (raw stock went negative!)':''),'ok');
}

  `,`<button class="btn btn-outline" onclick="closeModal()">Close</button><button class="btn btn-danger" onclick="deleteProdBatch('${id}')">${I.trash} Delete (reverses stock)</button>`);
}
function deleteProdBatch(id){
  const b=db.production.find(x=>x.id===id);if(!b)return;
  askConfirm('Delete <b>'+b.no+'</b>? Input stock is added back and output stock reversed.',()=>{
    pushUndo('Production batch '+b.no);
    let neg=false;
    b.inputs.forEach(x=>{const p=db.products.find(y=>y.id===x.pid);if(p)p.stock+=x.qty;});
    b.outputs.forEach(x=>{const p=db.products.find(y=>y.id===x.pid);if(p){p.stock-=x.qty;if(p.stock<0)neg=true;}});
    db.production=db.production.filter(x=>x.id!==id);save();closeModal();render();
    toast('Batch deleted, stock reversed'+(neg?' — output stock went negative!':''),'ok');
  },'Delete Batch');
}

  const j=db.jobwork.find(x=>x.id===id);if(!j)return;

    pushUndo('Job work '+j.no);

function jwBillDo(j){
  let svc=db.products.find(p=>p.role==='service');
  if(!svc){svc={id:uid(),name:'Grinding Charges',brand:'Service',category:'Job Work',sku:'SV-GRIND',barcode:'',hsn:'998540',unit:j.unit||'kg',role:'service',purchasePrice:0,price:j.rate,gstRate:0,stock:0,lowStock:0,createdAt:Date.now()};db.products.push(svc);}
  const items=[{pid:svc.id,name:'Grinding Charges — '+j.material,hsn:svc.hsn,sku:svc.sku,unit:j.unit||'kg',price:j.rate,qty:j.inQty,disc:0,gstRate:svc.gstRate}];
  const T=billTotals(items,j.customerId);
  db.counters.invoice=(db.counters.invoice||0)+1;
  const no=db.settings.invoicePrefix+String(db.counters.invoice).padStart(4,'0');
  const adv=Math.min(T.grandTotal,j.advance||0);
  const inv={id:uid(),no,date:todayStr(),time:nowTime(),customerId:j.customerId||'',customerName:j.customerName,items,subTotal:T.subTotal,taxTotal:T.taxTotal,cgst:T.cgst,sgst:T.sgst,igst:T.igst,roundOff:T.roundOff,grandTotal:T.grandTotal,payMode:adv>=T.grandTotal-0.5?'Cash':'Credit',paid:adv,notes:'Job work '+j.no+' — '+fqU(j.inQty,j.unit)+' '+j.material,returnAmount:0,createdAt:Date.now()};
  db.invoices.push(inv);
  j.status='delivered';j.invoiceNo=no;j.charge=T.grandTotal;
  save();closeModal();S.view='invoices';S.currentInvoice=inv.id;render();
  toast('Delivered — invoice '+no+' created','ok');
  setTimeout(()=>openPrintPreview(inv.id),400);
}
function jwDel(id){
  const j=db.jobwork.find(x=>x.id===id);if(!j)return;
  askConfirm('Delete <b>'+j.no+'</b>?'+(j.invoiceNo?' Its invoice will remain in Invoices.':''),()=>{
    pushUndo('Job work '+j.no);
    db.jobwork=db.jobwork.filter(x=>x.id!==id);save();closeModal();render();toast('Job work order deleted','ok');
  },'Delete');
}

function estAdd(){

  const el=document.getElementById('est_rows');if(!el)return;

function staffMonth(){if(!S.staffM)S.staffM=todayStr().slice(0,7);return S.staffM;}
function monthDays(m){const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate();}
function monthLabel(m){const n=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const[y,mm]=m.split('-');return n[Number(mm)-1]+' '+y;}
function staffShift(delta){const[y,mm]=staffMonth().split('-').map(Number);const d=new Date(y,mm-1+delta,1);S.staffM=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render();}
const empOf=id=>db.employees.find(e=>e.id===id);
const attOf=(eid,d)=>db.attendance.find(a=>a.eid===eid&&a.d===d);
function attCycle(eid,d){
  const order=['P','A','H'];
  const rec=attOf(eid,d);
  let ns;
  if(!rec)ns='P';
  else{const ix=order.indexOf(rec.s);ns=ix===2?null:order[ix+1];}
  if(ns===null)db.attendance=db.attendance.filter(a=>a!==rec);
  else if(rec)rec.s=ns;
  else db.attendance.push({eid,d,s:ns});
  save();render();
}
function attMarkAllToday(){
  let n=0;
  db.employees.filter(e=>e.active!==false).forEach(e=>{const rec=attOf(e.id,todayStr());if(!rec||rec.s!=='P'){if(rec)rec.s='P';else db.attendance.push({eid:e.id,d:todayStr(),s:'P'});n++;}});
  save();render();
  toast(n?n+' employee(s) marked present today':'Everyone already marked present','ok');
}
function staffSum(eid,m){
  const emp=empOf(eid)||{salary:0};
  const days=monthDays(m);
  let p=0,a=0,h=0;
  db.attendance.forEach(x=>{if(x.eid===eid&&x.d&&x.d.startsWith(m)){if(x.s==='P')p++;else if(x.s==='H')h++;else if(x.s==='A')a++;}});
  const earned=Math.round((emp.salary||0)/days*(p+0.5*h));
  const paid=db.payroll.filter(x=>x.eid===eid&&x.type==='salary'&&x.month===m).reduce((s,x)=>s+(x.amount||0),0);
  const adv=db.payroll.filter(x=>x.eid===eid&&x.type==='advance'&&x.month===m).reduce((s,x)=>s+(x.amount||0),0);
  return{p,a,h,days,perDay:(emp.salary||0)/days,earned,paid,adv,balance:earned-paid-adv};
}

/* =====================================================
   QR CODE — offline generator (byte mode, ECC M, v1-v10)
   ===================================================== */
const QR_EXP=new Array(510),QR_LOG=new Array(256);
(function(){let x=1;for(let i=0;i<255;i++){QR_EXP[i]=x;QR_LOG[x]=i;x<<=1;if(x&0x100)x^=0x11D;}for(let i=255;i<510;i++)QR_EXP[i]=QR_EXP[i-255];})();
const qrMul=(a,b)=>(!a||!b)?0:QR_EXP[QR_LOG[a]+QR_LOG[b]];
const QR_CAP={ec:[10,16,26,18,24,16,18,22,22,26],blocks:[1,1,1,2,2,4,4,4,5,5],total:[26,44,70,100,134,172,196,242,292,346]};
const QR_ALIGN={2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};
function qrGenPoly(n){
  let poly=[1];
  for(let i=0;i<n;i++){
    const np=new Array(poly.length+1).fill(0);
    for(let j=0;j<poly.length;j++){np[j]^=poly[j];np[j+1]^=qrMul(poly[j],QR_EXP[i]);}
    poly=np;
  }
  return poly;
}
function qrRs(data,n){
  const gen=qrGenPoly(n);
  const res=data.concat(new Array(n).fill(0));
  for(let i=0;i<data.length;i++){
    const f=res[i];if(f===0)continue;
    for(let j=1;j<gen.length;j++)res[i+j]^=qrMul(gen[j],f);
  }
  return res.slice(data.length);
}
function qrMatrix(text){
  let bytes;
  try{bytes=Array.from(new TextEncoder().encode(text));}
  catch(e){bytes=[];for(let i=0;i<text.length;i++)bytes.push(text.charCodeAt(i)&0xFF);}
  let ver=0,dataCw=0,ecCw=0,nBlocks=0;
  for(let v=1;v<=10;v++){
    const dc=QR_CAP.total[v-1]-QR_CAP.ec[v-1]*QR_CAP.blocks[v-1];
    if(bytes.length<=Math.floor((dc*8-4-(v<10?8:16))/8)){ver=v;dataCw=dc;ecCw=QR_CAP.ec[v-1];nBlocks=QR_CAP.blocks[v-1];break;}
  }
  if(!ver)return null;
  const bits=[];
  const push=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1);};
  push(4,4);
  push(bytes.length,ver<10?8:16);
  bytes.forEach(b=>push(b,8));
  const cap=dataCw*8;
  const term=Math.min(4,cap-bits.length);
  if(term>0)push(0,term);
  while(bits.length%8)bits.push(0);
  const cw=[];
  for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b*2+bits[i+j];cw.push(b);}
  for(let p=0;cw.length<dataCw;p++)cw.push([0xEC,0x11][p%2]);
  const shortLen=Math.floor(dataCw/nBlocks),nLong=dataCw%nBlocks;
  const blocks=[];let off=0;
  for(let b=0;b<nBlocks;b++){const len=shortLen+(b<nLong?1:0);blocks.push(cw.slice(off,off+len));off+=len;}
  const ecBlocks=blocks.map(bl=>qrRs(bl,ecCw));
  const out=[];
  for(let i=0;i<=shortLen;i++)blocks.forEach(bl=>{if(i<bl.length)out.push(bl[i]);});
  for(let i=0;i<ecCw;i++)ecBlocks.forEach(eb=>out.push(eb[i]));
  const size=17+ver*4;
  const mods=[],fn=[];
  for(let y=0;y<size;y++){mods.push(new Array(size).fill(false));fn.push(new Array(size).fill(false));}
  const setFn=(x,y,v)=>{mods[y][x]=v;fn[y][x]=true;};
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy));const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=size||y>=size)continue;setFn(x,y,d!==2&&d!==4);}};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  for(let i=8;i<size-8;i++){setFn(6,i,i%2===0);setFn(i,6,i%2===0);}
  if(ver>=2){
    const P=QR_ALIGN[ver],last=P[P.length-1];
    P.forEach(cx=>P.forEach(cy=>{
      if((cx===6&&cy===6)||(cx===last&&cy===6)||(cx===6&&cy===last))return;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
        const d=Math.max(Math.abs(dx),Math.abs(dy));
        setFn(cx+dx,cy+dy,d!==1);
      }
    }));
  }
  const fmtPos=[];
  for(let i=0;i<=5;i++)fmtPos.push([8,i]);
  fmtPos.push([8,7],[8,8],[7,8]);
  for(let i=9;i<15;i++)fmtPos.push([14-i,8]);
  for(let i=0;i<8;i++)fmtPos.push([size-1-i,8]);
  for(let i=8;i<15;i++)fmtPos.push([8,size-15+i]);
  fmtPos.forEach(p=>{mods[p[1]][p[0]]=false;fn[p[1]][p[0]]=true;});
  setFn(8,size-8,true);
  if(ver>=7){
    for(let i=0;i<18;i++){
      const a=size-11+i%3,b=Math.floor(i/3);
      fn[b][a]=true;fn[a][b]=true;
    }
  }
  let idx=0;
  for(let right=size-1;right>=1;right-=2){
    if(right===6)right=5;
    for(let vert=0;vert<size;vert++){
      for(let j=0;j<2;j++){
        const x=right-j;
        const up=((right+1)&2)===0;
        const y=up?size-1-vert:vert;
        if(!fn[y][x]&&idx<out.length*8){
          mods[y][x]=((out[idx>>>3]>>>(7-(idx&7)))&1)===1;
          idx++;
        }
      }
    }
  }
  const maskBit=(m,x,y)=>{
    switch(m){
      case 0:return (x+y)%2===0;
      case 1:return y%2===0;
      case 2:return x%3===0;
      case 3:return (x+y)%3===0;
      case 4:return (Math.floor(x/3)+Math.floor(y/2))%2===0;
      case 5:return (x*y)%2+(x*y)%3===0;
      case 6:return ((x*y)%2+(x*y)%3)%2===0;
      default:return ((x+y)%2+(x*y)%3)%2===0;
    }
  };
  const penalty=mx=>{
    let pen=0;
    for(let y=0;y<size;y++){
      let run=1;
      for(let x=1;x<size;x++){
        if(mx[y][x]===mx[y][x-1])run++;else{if(run>=5)pen+=3+(run-5);run=1;}
      }
      if(run>=5)pen+=3+(run-5);
    }
    for(let x=0;x<size;x++){
      let run=1;
      for(let y=1;y<size;y++){
        if(mx[y][x]===mx[y-1][x])run++;else{if(run>=5)pen+=3+(run-5);run=1;}
      }
      if(run>=5)pen+=3+(run-5);
    }
    for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){
      const v=mx[y][x];
      if(v===mx[y][x+1]&&v===mx[y+1][x]&&v===mx[y+1][x+1])pen+=3;
    }
    let dark=0;for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(mx[y][x])dark++;
    const total=size*size;
    pen+=10*Math.max(0,Math.ceil(Math.abs(dark*20-total*10)/total)-1);
    return pen;
  };
  let bestMask=0,bestPen=Infinity,bestMx=null;
  for(let m=0;m<8;m++){
    const mx=mods.map(r=>r.slice());
    for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!fn[y][x]&&maskBit(m,x,y))mx[y][x]=!mx[y][x];
    const p=penalty(mx);
    if(p<bestPen){bestPen=p;bestMask=m;bestMx=mx;}
  }
  const gb=(v,i)=>((v>>>i)&1)===1;
  const setV=(x,y,v)=>{bestMx[y][x]=v;};
  let rem=bestMask;
  for(let i=0;i<10;i++)rem=(rem<<1)^((rem>>>9)*0x537);
  const fbits=((bestMask<<10)|rem)^0x5412;
  for(let i=0;i<=5;i++)setV(8,i,gb(fbits,i));
  setV(8,7,gb(fbits,6));setV(8,8,gb(fbits,7));setV(7,8,gb(fbits,8));
  for(let i=9;i<15;i++)setV(14-i,8,gb(fbits,i));
  for(let i=0;i<8;i++)setV(size-1-i,8,gb(fbits,i));
  for(let i=8;i<15;i++)setV(8,size-15+i,gb(fbits,i));
  if(ver>=7){
    let vrem=ver;
    for(let i=0;i<12;i++)vrem=(vrem<<1)^((vrem>>>11)*0x1F25);
    const vbits=(ver<<12)|vrem;
    for(let i=0;i<18;i++){
      const a=size-11+i%3,b=Math.floor(i/3);
      setV(a,b,gb(vbits,i));
      setV(b,a,gb(vbits,i));
    }
  }
  return bestMx;
}
function qrSVG(text,px){
  const m=qrMatrix(text);
  if(!m)return '';
  const size=m.length,quiet=4,total=size+quiet*2;
  let rects='';
  for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(m[y][x])rects+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+total+' '+total+'" shape-rendering="crispEdges" style="width:'+px+'px;height:'+px+'px;background:#fff">'+
    '<rect width="'+total+'" height="'+total+'" fill="#fff"/>'+
    '<g fill="#000" transform="translate('+quiet+','+quiet+')">'+rects+'</g></svg>';
}
function upiUri(amount,note){
  const s=db.settings;
  if(!s.upiId)return '';
  return 'upi://pay?pa='+encodeURIComponent(s.upiId)+'&pn='+encodeURIComponent(s.shopName||'Shop')+
    (amount?'&am='+Number(amount).toFixed(2):'')+'&cu=INR'+(note?'&tn='+encodeURIComponent(note):'');
}
function upiQRHTML(amount,note,px){

function openAuditModal(){

  openModal('Stock Audit — Physical Count',`

    <div class="search" style="margin-top:8px"><input class="input" id="aud_q" placeholder="Filter items…" oninput="auditFilter()">${I.search}</div>
    <div id="aud_rows" style="margin-top:10px;max-height:44vh;overflow:auto">${auditRowsHTML('')}</div>
    <div class="totline grand"><span>Corrections / variance value</span><span class="mono" id="audVar">—</span></div>
  `,`<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAudit()">${I.check} Save & Correct Stock</button>`);
  updAuditVar();
}
function auditRowsHTML(q){
  q=(q||'').toLowerCase();
  const prods=db.products.filter(p=>p.role!=='service'&&(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)));
  return prods.map(p=>`
    <div class="lrow" style="padding:6px 0">
      <div class="l-main"><div class="l-t">${esc(p.name)}</div><div class="l-s">System: ${fq(p.stock,p.unit)} ${uomOf(p.unit).l} · ${esc(p.sku)}</div></div>
      <input id="aud_${p.id}" class="input" type="number" inputmode="decimal" style="width:88px" placeholder="${p.stock}" min="0" step="0.01" oninput="updAuditVar()">
    </div>`).join('')||`<div class="small muted" style="padding:8px 2px">No items match.</div>`;
}
function auditFilter(){const el=document.getElementById('aud_q');const rows=document.getElementById('aud_rows');if(rows)rows.innerHTML=auditRowsHTML(el?el.value:'');updAuditVar();}
function updAuditVar(){
  const el=document.getElementById('audVar');if(!el)return;
  let n=0,val=0;
  db.products.filter(p=>p.role!=='service').forEach(p=>{
    const inp=document.getElementById('aud_'+p.id);
    if(!inp||inp.value==='')return;
    const a=num(inp.value);
    if(Math.abs(a-p.stock)>0.0005){n++;val+=(a-p.stock)*p.purchasePrice;}
  });
  el.textContent=n?n+' item(s) · '+(val>=0?'+':'−')+' '+fmt(Math.abs(val)):'none yet';
}
function saveAudit(){
  const items=[];
  db.products.filter(p=>p.role!=='service').forEach(p=>{
    const inp=document.getElementById('aud_'+p.id);
    if(!inp||inp.value==='')return;
    const a=Math.max(0,num(inp.value));
    if(Math.abs(a-p.stock)>0.0005)items.push({pid:p.id,name:p.name,unit:p.unit,sys:p.stock,actual:a});
  });
  if(!items.length){toast('No corrections entered — nothing to save','err');return;}
  let netVal=0;
  items.forEach(it=>{
    const p=db.products.find(x=>x.id===it.pid);if(!p)return;
    netVal+=(it.actual-it.sys)*p.purchasePrice;
    const delta=it.actual-p.stock;
    p.stock=Math.round(it.actual*1000)/1000;
    if(p.batches&&p.batches.length&&delta!==0){
      let rem=delta;
      for(let bi=p.batches.length-1;bi>=0&&rem!==0;bi--){
        const b=p.batches[bi];
        if(rem>0){b.qty=Math.round((b.qty+rem)*1000)/1000;rem=0;}
        else{const take=Math.min(b.qty,-rem);b.qty=Math.round((b.qty-take)*1000)/1000;rem+=take;}
      }
      p.batches=p.batches.filter(b=>b.qty>0.0005);
    }
  });
  db.audits.push({id:uid(),date:todayStr(),time:nowTime(),items,netValue:netVal,createdAt:Date.now()});
  save();closeModal();render();
  toast('Audit saved — '+items.length+' correction(s), value '+(netVal>=0?'+':'−')+fmt(Math.abs(netVal)),'ok');
}
function viewAudit(id){
  const a=db.audits.find(x=>x.id===id);if(!a)return;
  openModal('Stock Audit — '+niceDate(a.date)+' '+esc(a.time||''),`
    <table class="tbl"><thead><tr><th>Item</th><th style="text-align:right">System</th><th style="text-align:right">Counted</th><th style="text-align:right">Diff</th></tr></thead>
    <tbody>${a.items.map(it=>`<tr><td>${esc(it.name)}</td><td class="mono" style="text-align:right">${nf(it.sys)}</td><td class="mono" style="text-align:right">${nf(it.actual)}</td><td class="mono" style="text-align:right;color:${it.actual-it.sys<0?'var(--red)':'var(--green)'}">${it.actual-it.sys>0?'+':''}${nf(it.actual-it.sys)}</td></tr>`).join('')}</tbody></table>

}

function openReturnModal(invId){
  const i=invOf(invId);if(!i)return;
  const keyOf=it=>it.pid+'|'+(it.packLabel||'');
  const alreadyRet={};db.returns.filter(r=>r.invoiceId===invId).forEach(r=>r.items.forEach(it=>{const k=it.pid+'|'+(it.packLabel||'');alreadyRet[k]=(alreadyRet[k]||0)+it.qty;}));
  const items=i.items.map((it,n)=>{const max=it.qty-(alreadyRet[keyOf(it)]||0);return{n,pid:it.pid,name:it.name,max,packLabel:it.packLabel||'',contains:it.contains||1,unitPrice:it.total/it.qty,unit:it.unit||'pcs',sold:it.qty};}).filter(x=>x.max>0);
  if(!items.length){toast('All items already returned','err');return;}
  openModal('Return Items — '+esc(i.no),`
    <div class="small muted">Enter quantity to return. Stock will be restored.</div>
    ${items.map(x=>`<div class="row" style="margin-top:10px">
      <div style="flex:1;min-width:0"><div class="small" style="font-weight:600">${esc(x.name)}</div><div class="small muted">${fqU(x.sold,x.unit)} · ${fmt(x.unitPrice)}/unit</div></div>
      <input id="ret_q_${x.n}" class="input" type="number" min="0" step="0.01" max="${x.max}" value="0" style="width:80px" oninput="updReturnTotal(${JSON.stringify(items.map(y=>({n:y.n,unitPrice:Math.round(y.unitPrice*100)/100}))).replace(/"/g,'&quot;')})">
    </div>`).join('')}
    <label class="label">Refund Mode</label>
    <select id="ret_mode" class="select"><option>Cash Refund</option><option>Adjust from Dues</option></select>
    <div class="totline grand"><span>Total Refund</span><span class="mono" id="retTotal">${fmt(0)}</span></div>
  `,`<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveReturn('${invId}')">${I.check} Save Return</button>`);
}
function updReturnTotal(itemsMeta){
  const t=itemsMeta.reduce((a,x)=>a+num(document.getElementById('ret_q_'+x.n)?.value)*x.unitPrice,0);
  const el=document.getElementById('retTotal');if(el)el.textContent=fmt(t);
  return t;
}
function saveReturn(invId){
  if(!needEdit('returns'))return;
  const i=invOf(invId);if(!i)return;
  const items=[];
  let refund=0;
  i.items.forEach((it,n)=>{
    const el=document.getElementById('ret_q_'+n);
    const q=el?Math.min(it.qty,Math.max(0,num(el.value))):0;
    if(q>0){const amt=it.total*q/it.qty;refund+=amt;items.push({pid:it.pid,name:it.name,qty:q,unit:it.unit||'pcs',packLabel:it.packLabel||'',contains:it.contains||1,amount:amt});}
  });
  if(!items.length){toast('Enter quantity to return','err');return;}
  const mode=document.getElementById('ret_mode')?document.getElementById('ret_mode').value:'Cash Refund';
  db.counters.ret=(db.counters.ret||0)+1;
  const r={id:uid(),no:db.settings.returnPrefix+String(db.counters.ret).padStart(4,'0'),invoiceId:invId,invoiceNo:i.no,customerId:i.customerId,customerName:i.customerName,date:todayStr(),items,refund,mode,createdAt:Date.now()};
  db.returns.push(r);
  items.forEach(it=>{const p=db.products.find(x=>x.id===it.pid);if(p)p.stock=Math.round((p.stock+it.qty*(it.contains||1))*1000)/1000;});
  if(mode==='Adjust from Dues')i.returnAmount=(i.returnAmount||0)+refund;
  save();closeModal();render();toast('Return saved — '+fmt(refund),'ok');
}
function deleteReturn(id){
  const r=db.returns.find(x=>x.id===id);if(!r)return;
  askConfirm('Delete return <b>'+r.no+'</b>? Stock will be reduced back.',()=>{
    pushUndo('Return '+r.no);
    r.items.forEach(it=>{const p=db.products.find(x=>x.id===it.pid);if(p)p.stock=Math.round((p.stock-it.qty*(it.contains||1))*1000)/1000;});
    const inv=invOf(r.invoiceId);
    if(inv&&r.mode==='Adjust from Dues')inv.returnAmount=Math.max(0,(inv.returnAmount||0)-r.refund);
    db.returns=db.returns.filter(x=>x.id!==id);save();closeModal();render();toast('Return deleted','ok');
  },'Delete');
}
