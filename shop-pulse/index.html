/* =====================================================
   DAY BOOK — daily register + cash reconciliation
   ===================================================== */
function dbDateStr(){if(!S.dbDate)S.dbDate=todayStr();return S.dbDate;}
function dbShift(days){const d=new Date(dbDateStr()+'T00:00:00');d.setDate(d.getDate()+days);S.dbDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');render();}
function cashLogOf(d){return db.cashLogs.find(c=>c.date===d)||null;}
function dayBookData(d){
  const bills=db.invoices.filter(i=>i.date===d);
  const pays=db.payments.filter(p=>p.date===d);
  const rets=db.returns.filter(r=>r.date===d);
  const exps=db.expenses.filter(e=>e.date===d);
  const purs=db.purchases.filter(p=>p.date===d);
  const payr=db.payroll.filter(p=>p.date===d);
  const cashIn=pays.filter(p=>p.mode==='Cash').reduce((a,p)=>a+p.amount,0);
  const digiIn=pays.filter(p=>p.mode!=='Cash').reduce((a,p)=>a+p.amount,0);
  const expTotal=exps.reduce((a,e)=>a+num(e.amount),0);
  const purPaid=purs.reduce((a,p)=>a+(p.paid||0),0);
  const payTotal=payr.reduce((a,p)=>a+p.amount,0);
  const cashOut=expTotal+purPaid+payTotal;
  const retCash=rets.filter(r=>r.mode==='Cash Refund').reduce((a,r)=>a+r.refund,0);
  const retAdj=rets.filter(r=>r.mode!=='Cash Refund').reduce((a,r)=>a+r.refund,0);
  const credit=bills.reduce((a,i)=>a+invDue(i),0);
  const sales=bills.reduce((a,i)=>a+i.grandTotal,0);
  return{bills,pays,rets,exps,purs,payr,cashIn,digiIn,cashOut,expTotal,purPaid,payTotal,retCash,retAdj,credit,sales};
}
function vDayBook(){
  const d=dbDateStr();
  const D=dayBookData(d);
  const log=cashLogOf(d);
  const opening=log?log.opening:0,counted=log?log.counted:0;
  const expected=opening+D.cashIn-D.cashOut-D.retCash;
  const variance=counted-expected;
  const anyTx=D.bills.length||D.pays.length||D.rets.length||D.exps.length||D.purs.length||D.payr.length;
  const line=(ic,bg,col,t,s,amt)=>`<div class="lrow" style="cursor:default"><div class="l-ic" style="background:${bg};color:${col}">${ic}</div><div class="l-main"><div class="l-t">${t}</div>${s?`<div class="l-s">${s}</div>`:''}</div><div class="l-r"><div class="l-t mono" style="color:${col}">${amt}</div></div></div>`;
  return `
  <div class="chips">
    <button class="chip" onclick="dbShift(-1)">‹ Prev</button>
    <input type="date" class="input" style="width:auto;padding:6px 10px;font-size:13.5px" value="${d}" onchange="S.dbDate=this.value;render()">
    <button class="chip ${d===todayStr()?'active':''}" onclick="S.dbDate=todayStr();render()">Today</button>
    <button class="chip" onclick="dbShift(1)">Next ›</button>
  </div>
  <div class="small muted" style="margin:10px 0">${I.cal} ${niceDate(d)} · all money in & out for this day</div>
  <div class="stats" style="grid-template-columns:repeat(2,1fr)">
    <div class="card stat"><div class="s-value" style="color:var(--green)">${fmt(D.cashIn-D.retCash)}</div><div class="s-label">Cash Collected</div><div class="s-sub">− cash refunds ${fmt(D.retCash)}</div></div>
    <div class="card stat"><div class="s-value" style="color:var(--green)">${fmt(D.digiIn)}</div><div class="s-label">Digital In</div><div class="s-sub">UPI / Card / Bank · ${D.pays.length} payment(s)</div></div>
    <div class="card stat"><div class="s-value" style="color:var(--red)">${fmt(D.cashOut)}</div><div class="s-label">Cash Paid Out</div><div class="s-sub">exp ${fmt(D.expTotal)} · purch ${fmt(D.purPaid)} · staff ${fmt(D.payTotal)}</div></div>
    <div class="card stat"><div class="s-value" style="color:var(--amber)">${fmt(D.credit)}</div><div class="s-label">Credit Given</div><div class="s-sub">${D.bills.length} bill(s) · sales ${fmt(D.sales)}</div></div>
  </div>
  <div class="card pad" style="margin-top:14px">
    <div class="section-title" style="margin-top:0">Cash Reconciliation <span class="small muted">(drawer check at day close)</span></div>
    <div class="fgrid">
      <div><label class="label">Opening Cash (morning)</label><input id="db_open" class="input" type="number" value="${opening}" oninput="updCashRecon()"></div>
      <div><label class="label">Counted Cash (now in drawer)</label><input id="db_count" class="input" type="number" value="${counted}" oninput="updCashRecon()"></div>
    </div>
    <div class="totline"><span>Cash collected − paid out</span><b class="mono">${fmt(D.cashIn-D.retCash-D.cashOut)}</b></div>
    <div class="totline"><span>Expected cash in drawer</span><b class="mono" id="db_exp">${fmt(expected)}</b></div>
    <div class="totline grand"><span>Variance</span><span class="mono" id="db_var" style="color:${Math.abs(variance)>0.5?'var(--red)':'var(--green)'}">${variance>=0?'+':'−'} ${fmt(Math.abs(variance))}</span></div>
    <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="saveCashLog()">${I.check} Save Reconciliation</button>
    ${counted&&Math.abs(variance)>0.5?`<div class="small" style="margin-top:8px;color:var(--amber)">${I.alert} Cash ${variance>0?'short':'excess'} by ${fmt(Math.abs(variance))} — recount or find the missing entry.</div>`:`<div class="small muted" style="margin-top:8px">${counted?'Counted matches expected.':''} Enter counted cash after closing the drawer.</div>`}
  </div>
  ${anyTx?`<div class="card" style="margin-top:14px">
    <div class="between pad" style="padding-bottom:8px"><b style="font-size:14.5px">Transactions — ${niceDate(d)}</b><button class="btn btn-ghost btn-sm" onclick="exportDayBookCSV()">${I.down} CSV</button></div>
    ${D.bills.map(i=>`<div class="lrow" onclick="go('invoice','${i.id}')"><div class="l-ic">${esc((i.customerName||'W')[0])}</div><div class="l-main"><div class="l-t">${esc(i.no)} · ${esc(i.customerName||'Walk-in')}</div><div class="l-s">Bill · ${i.time||''} · ${esc(i.payMode)}</div></div><div class="l-r"><div class="l-t mono">${fmt(i.grandTotal)}</div>${invDue(i)>0.5?`<span class="badge amber">Due ${fmt(invDue(i))}</span>`:`<span class="badge green">Paid</span>`}</div></div>`).join('')}
    ${D.pays.filter(p=>p.type==='collect').map(p=>`<div class="lrow" onclick="go('invoice','${p.refId}')"><div class="l-ic" style="background:var(--green-bg);color:var(--green)">${I.rupee}</div><div class="l-main"><div class="l-t">Collected from ${esc(p.customerName||'')}</div><div class="l-s">${esc(p.refNo)} · ${p.time||''} · ${esc(p.mode)}</div></div><div class="l-r"><div class="l-t mono" style="color:var(--green)">+ ${fmt(p.amount)}</div></div></div>`).join('')}
    ${D.rets.map(r=>line(I.undo,'var(--amber-bg)','var(--amber)',esc(r.no)+' — refund',esc(r.customerName||'')+' · '+esc(r.mode),'− '+fmt(r.refund))).join('')}
    ${D.exps.map(e=>line(I.wallet,'var(--red-bg)','var(--red)','Expense: '+esc(e.category||'Other'),esc(e.note||''),'− '+fmt(e.amount))).join('')}
    ${D.purs.map(p=>line(I.truck,'var(--red-bg)','var(--red)','Purchase: '+esc(p.no),esc(p.supplierName||'')+' · '+p.items.length+' item(s)','− '+fmt(p.paid||0))).join('')}
    ${D.payr.map(p=>{const em=empOf(p.eid);return line(p.type==='salary'?I.wallet:I.down,'var(--red-bg)','var(--red)',(p.type==='salary'?'Salary: ':'Advance: ')+(em?em.name:'—'),monthLabel(p.month||'')+' · '+niceDate(p.date),'− '+fmt(p.amount));}).join('')}
  </div>`:`<div class="card empty" style="margin-top:14px">${I.cal}<div>No transactions on ${niceDate(d)}</div></div>`}`;
}
function updCashRecon(){
  const D=dayBookData(dbDateStr());
  const opening=num(document.getElementById('db_open').value);
  const counted=num(document.getElementById('db_count').value);
  const expected=opening+D.cashIn-D.cashOut-D.retCash;
  const v=counted-expected;
  const e1=document.getElementById('db_exp');if(e1)e1.textContent=fmt(expected);
  const e2=document.getElementById('db_var');if(e2){e2.textContent=(v>=0?'+':'−')+' '+fmt(Math.abs(v));e2.style.color=Math.abs(v)>0.5?'var(--red)':'var(--green)';}
}
function saveCashLog(){
  if(!needEdit('daybook'))return;
  const d=dbDateStr();
  const opening=num(document.getElementById('db_open').value);
  const counted=num(document.getElementById('db_count').value);
  const D=dayBookData(d);
  const expected=opening+D.cashIn-D.cashOut-D.retCash;
  const variance=counted-expected;
  const ex=cashLogOf(d);
  if(ex)Object.assign(ex,{opening,counted,expected,variance,updatedAt:Date.now()});
  else db.cashLogs.push({id:uid(),date:d,opening,counted,expected,variance,updatedAt:Date.now()});
  save();render();toast('Cash reconciliation saved for '+niceDate(d),'ok');
}
function exportDayBookCSV(){
  const d=dbDateStr();const D=dayBookData(d);
  const rows=[['Type','Ref','Detail','Time','Mode','Amount']];
  D.bills.forEach(i=>rows.push(['Sale',i.no,i.customerName,i.time||'',i.payMode,i.grandTotal.toFixed(2)]));
  D.pays.filter(p=>p.type==='collect').forEach(p=>rows.push(['Collection',p.refNo,p.customerName,p.time||'',p.mode,p.amount.toFixed(2)]));
  D.rets.forEach(r=>rows.push(['Return refund',r.no,r.customerName,'',r.mode,(-r.refund).toFixed(2)]));
  D.exps.forEach(e=>rows.push(['Expense',e.category||'',e.note||'','','Cash',(-num(e.amount)).toFixed(2)]));
  D.purs.forEach(p=>rows.push(['Purchase',p.no,p.supplierName||'','','Cash',(-(p.paid||0)).toFixed(2)]));
  D.payr.forEach(p=>{const em=empOf(p.eid);rows.push([p.type==='salary'?'Salary paid':'Advance given','',em?em.name:'','','Cash',(-p.amount).toFixed(2)]);});
  downloadFile('daybook_'+d+'.csv',rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');
  toast('Day book CSV downloaded','ok');
}

/* =====================================================
   PROFIT & LOSS (monthly, GST-excluded revenue)
   ===================================================== */
function plMonth(){if(!S.plM)S.plM=todayStr().slice(0,7);return S.plM;}
function plShift(delta){const[y,mm]=plMonth().split('-').map(Number);const dd=new Date(y,mm-1+delta,1);S.plM=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0');render();}
function plData(m){return plDataRange(m+'-01',m+'-31');}
function plDataRange(from,to){
  const bills=db.invoices.filter(i=>i.date>=from&&i.date<=to);
  const rets=db.returns.filter(r=>r.date>=from&&r.date<=to);
  const exps=db.expenses.filter(e=>e.date>=from&&e.date<=to);
  const jobs=db.jobwork.filter(j=>(j.date||'')>=from&&(j.date||'')<=to&&j.status==='delivered');
  const salary=db.payroll.filter(p=>p.date>=from&&p.date<=to&&p.type==='salary');
  const revSales=bills.reduce((a,i)=>a+i.subTotal,0);
  const gstOut=bills.reduce((a,i)=>a+i.cgst+i.sgst+i.igst,0);
  let revRet=0,retCost=0;
  rets.forEach(r=>{
    const inv=invOf(r.invoiceId);
    r.items.forEach(it=>{
      const li=inv?inv.items.find(x=>x.pid===it.pid&&(x.packLabel||'')===(it.packLabel||'')):null;
      const ratio=li&&li.total>0?li.taxable/li.total:1;
      revRet+=it.amount*ratio;
      const p=db.products.find(x=>x.id===it.pid);
      retCost+=(p?p.purchasePrice:0)*it.qty*(it.contains||1);
    });
  });
  const jInc=jobs.reduce((a,j)=>a+(j.charge||0),0);
  const cogs=bills.reduce((a,i)=>a+i.items.reduce((b,it)=>{const p=db.products.find(x=>x.id===it.pid);return b+(p?p.purchasePrice:0)*it.qty*(it.contains||1);},0),0)-retCost;
  const revenue=revSales-revRet+jInc;
  const gross=revenue-cogs;
  const expTotal=exps.reduce((a,e)=>a+num(e.amount),0);
  const salaryTotal=salary.reduce((a,p)=>a+p.amount,0);
  const net=gross-expTotal-salaryTotal;
  const expByCat={};exps.forEach(e=>expByCat[e.category||'Other']=(expByCat[e.category||'Other']||0)+num(e.amount));
  return{bills,revSales,revRet,jInc,gstOut,cogs,revenue,gross,expTotal,expByCat,salaryTotal,net};
}

function reportRange(){
  const t=new Date();let from=new Date(),to=new Date();
  const fmtD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(S.reportRange==='today'){from=new Date(t);}
  else if(S.reportRange==='7'){from.setDate(t.getDate()-6);}
  else if(S.reportRange==='30'){from.setDate(t.getDate()-29);}
  else if(S.reportRange==='month'){from=new Date(t.getFullYear(),t.getMonth(),1);}
  else if(S.reportRange==='custom'){return [S.rFrom||fmtD(t),S.rTo||fmtD(t)];}
  return [fmtD(from),fmtD(to)];
}

let pinTry='';
function showLock(){
  pinTry='';
  const lk=$('#lock');
  lk.innerHTML=`<div class="lk-logo">🔒</div>
  <div class="lk-name">${esc(db.settings.shopName||'ShopPulse')}</div>

  <div class="lk-pad">
    ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinTap(${n})">${n}</button>`).join('')}
    <button onclick="pinTap(-1)" style="font-size:16px">⌫</button>
    <button onclick="pinTap(0)">0</button>
    <button onclick="pinTap(-2)" style="font-size:18px">${I.check}</button>
  </div>`;
  lk.classList.remove('hidden');

function pinTap(n){
  if(n===-1){pinTry=pinTry.slice(0,-1);}
  else if(n===-2){}
  else if(pinTry.length<4){pinTry+=n;}
  const dots=$('#lkDots');
  if(dots)dots.innerHTML=[0,1,2,3].map(i=>`<span class="${i<pinTry.length?'fill':''}"></span>`).join('');
  if(pinTry.length===4||n===-2){
    setTimeout(()=>{
      if(pinTry===db.settings.pin){pinTry='';$('#lock').classList.add('hidden');}
      else if(n===-2&&pinTry.length<4){toast('Enter all 4 digits','err');}
      else{pinTry='';const d=$('#lkDots');if(d)d.innerHTML='<span></span>'.repeat(4);toast('Wrong PIN','err');}
    },120);
  }
}
function openPinModal(){
  if(db.settings.pinOn){
    askConfirm('Disable App Lock?',()=>{db.settings.pinOn=false;db.settings.pin='';save();render();toast('App lock disabled','ok');},'Disable');
    return;
  }
  openModal('Set App Lock PIN',`
    <div class="small muted">Choose a 4-digit PIN. You'll be asked for it every time the app opens on this device.</div>
    <label class="label">4-Digit PIN</label><input id="pin_new" class="input" type="password" inputmode="numeric" maxlength="4" placeholder="****" oninput="this.value=this.value.replace(/\\D/g,'')">
  `,`<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePin()">${I.lock} Enable</button>`);
}
function savePin(){

function backup(silent){
  downloadFile('shoppulse_backup_'+todayStr()+'.json',JSON.stringify(db),'application/json');
  db.settings.lastBackupAt=new Date().toISOString();save();
  if(!silent)toast('Backup downloaded — keep it safe!','ok');

function backupAgeDays(){
  const t=db&&db.settings&&db.settings.lastBackupAt?Date.parse(db.settings.lastBackupAt):NaN;
  if(isNaN(t))return null;
  return Math.floor((Date.now()-t)/864e5);
}

function cloudHeaders(){
  const h={'Content-Type':'application/json'};
  if(db.settings.cloudKey)h['X-Api-Key']=db.settings.cloudKey;
  return h;
}
function cloudPayload(){
  const s=activeShop();
  return {app:'mobidukaan-pro',version:'4.4',shopId:s?s.id:(db.settings.shopName||'default'),shopName:db.settings.shopName,device:deviceId(),updatedAt:new Date().toISOString(),data:db};

async function cloudPush(){
  if(!needOwner())return;
  if(!db.settings.cloudUrl){toast('Enter your cloud database URL first','err');return;}
  if(typeof fetch!=='function'){toast('Network requests are not available here','err');return;}
  toast('Uploading to cloud…');
  try{
    const r=await fetch(db.settings.cloudUrl,{method:'POST',headers:cloudHeaders(),body:JSON.stringify(cloudPayload())});
    if(!r.ok)throw new Error('HTTP '+r.status);
    db.settings.lastCloudSyncAt=new Date().toISOString();db.settings.lastCloudDir='push';save();render();
    toast('Cloud push complete','ok');
  }catch(e){toast('Cloud push failed: '+(e.message||'network error'),'err');}
}
async function cloudPull(){
  if(!needOwner())return;
  if(!db.settings.cloudUrl){toast('Enter your cloud database URL first','err');return;}
  if(typeof fetch!=='function'){toast('Network requests are not available here','err');return;}
  askConfirm('<b>Pull from cloud?</b> The cloud copy will REPLACE the data on this device. A local backup file is downloaded first.',async()=>{
    backup(true);
    try{
      const sep=db.settings.cloudUrl.includes('?')?'&':'?';
      const s=activeShop();
      const shopId=encodeURIComponent(s?s.id:(db.settings.shopName||'default'));
      const r=await fetch(db.settings.cloudUrl+sep+'shopId='+shopId,{headers:cloudHeaders()});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();const data=j&&j.data?j.data:j;
      if(!data||!data.settings||!Array.isArray(data.products))throw new Error('endpoint did not return a ShopPulse backup');
      db=data;db.settings=Object.assign(defaultSettings(),data.settings||{});
      db.returns=db.returns||[];db.expenses=db.expenses||[];db.production=db.production||[];db.jobwork=db.jobwork||[];db.estimates=db.estimates||[];db.employees=db.employees||[];db.attendance=db.attendance||[];db.payroll=db.payroll||[];db.audits=db.audits||[];db.payments=db.payments||[];db.cashLogs=db.cashLogs||[];
      db.counters=Object.assign({invoice:0,purchase:0,ret:0,production:0,jobwork:0,est:0},data.counters||{});
      db.settings.lastCloudSyncAt=new Date().toISOString();db.settings.lastCloudDir='pull';
      save();S.pos=null;S.currentInvoice=null;S.currentCustomer=null;S.currentEmp=null;S.currentEstimate=null;S.multi={view:null,ids:[]};S.view='dashboard';applyTheme();render();
      toast('Cloud data pulled to this device','ok');
    }catch(e){toast('Cloud pull failed: '+(e.message||'network error'),'err');}
  },'Pull & Replace');
}

/* ---------- CSV import (products & customers) ---------- */
function parseCSV(text){
  const rows=[];let row=[],cell='',inQ=false;
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function csvHeaderMap(hdr){
  const h = hdr.map(c => String(c || '').trim().toLowerCase().replace(/[^a-z0-9]/g, ''));
  return h;
}
function importCSV(kind, inputElId){
  if(!needEdit(kind==='products'?'inventory':'customers'))return;
  const el = document.getElementById(inputElId);
  const text = el && el.value ? el.value.trim() : '';
  if (!text) { toast('Paste CSV text or choose a file first', 'err'); return; }
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('CSV must have a header row plus at least one data row', 'err'); return; }
  const H = csvHeaderMap(rows[0]);
  const col = (...names) => { for (const n of names) { const i = H.indexOf(n); if (i > -1) return i; } return -1; };
  const get = (r, i) => i > -1 && r[i] != null ? String(r[i]).trim() : '';
  let added = 0, skipped = 0, errors = 0;
  if (kind === 'products') {
    const ci = { name: col('name', 'product', 'itemname'), brand: col('brand'), category: col('category', 'cat'), sku: col('sku', 'code'), barcode: col('barcode'), hsn: col('hsn'), unit: col('unit', 'uom'), role: col('role', 'type'), purchasePrice: col('purchaseprice', 'cost', 'costprice'), price: col('price', 'sellingprice', 'mrp', 'rate'), gstRate: col('gstrate', 'gst', 'tax'), stock: col('stock', 'qty', 'quantity'), lowStock: col('lowstock', 'minstock') };
    if (ci.name < 0) { toast('CSV needs a "name" column', 'err'); return; }
    rows.slice(1).forEach(r => {
      const name = get(r, ci.name); if (!name) { errors++; return; }
      const sku = get(r, ci.sku) || ('IMP-' + (db.products.length + added + 1));
      if (db.products.some(p => p.name.toLowerCase() === name.toLowerCase() || p.sku === sku)) { skipped++; return; }
      const unit = get(r, ci.unit) || 'pcs';
      const roleRaw = get(r, ci.role).toLowerCase();
      const role = ['raw', 'finished', 'service'].includes(roleRaw) ? roleRaw : 'finished';
      db.products.push({
        id: uid(), name, brand: get(r, ci.brand), category: get(r, ci.category),
        sku, barcode: get(r, ci.barcode), hsn: get(r, ci.hsn), unit, role,
        purchasePrice: num(get(r, ci.purchasePrice)), price: num(get(r, ci.price)),
        gstRate: num(get(r, ci.gstRate)) || 0, stock: num(get(r, ci.stock)),
        lowStock: num(get(r, ci.lowStock)) || num(db.settings.lowStockDefault) || 5,
        packs: [], batches: [], createdAt: Date.now()
      });
      added++;
    });
  } else {
    const ci = { name: col('name', 'customer'), phone: col('phone', 'mobile'), gstin: col('gstin'), state: col('state'), address: col('address'), creditLimit: col('creditlimit', 'limit') };
    if (ci.name < 0) { toast('CSV needs a "name" column', 'err'); return; }
    rows.slice(1).forEach(r => {
      const name = get(r, ci.name); if (!name) { errors++; return; }
      if (db.customers.some(c => c.name.toLowerCase() === name.toLowerCase())) { skipped++; return; }
      db.customers.push({
        id: uid(), name, phone: get(r, ci.phone), gstin: get(r, ci.gstin).toUpperCase(),
        state: get(r, ci.state), address: get(r, ci.address),
        creditLimit: num(get(r, ci.creditLimit)), createdAt: Date.now()
      });
      added++;
    });
  }
  save();
  closeModal(); render();
  toast('Imported ' + added + (kind === 'products' ? ' product(s)' : ' customer(s)') + (skipped ? ' · ' + skipped + ' duplicate(s) skipped' : '') + (errors ? ' · ' + errors + ' empty row(s) ignored' : ''), 'ok');
}
function openImportModal(kind){
  const isProd = kind === 'products';
  openModal('Import ' + (isProd ? 'Products' : 'Customers') + ' from CSV', `
    <div class="small muted" style="line-height:1.55">
      Columns (order doesn't matter, header required):<br>
      ${isProd ? '<b>name</b>, brand, category, sku, barcode, hsn, unit (kg/ltr/pcs…), role (raw/finished/service), purchasePrice, price, gstRate, stock, lowStock' : '<b>name</b>, phone, gstin, state, address, creditLimit'}<br>
      Rows with a duplicate name${isProd ? ' or SKU' : ''} are skipped. Download the CSV Export first to see the exact format.

    <input type="file" id="impFile" accept=".csv,text/csv" style="margin-top:10px" onchange="readCSVFile('${kind}')">
    <label class="label" style="margin-top:10px">…or paste CSV text here</label>
    <textarea id="impText" class="input copybox" style="min-height:120px;font-family:monospace" placeholder="name,price,stock${'\n'}Sunflower Oil 1L,185,24"></textarea>
  `, `<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:1.2" onclick="importCSV('${kind}','impText')">${I.up} Import</button>`);
}
function readCSVFile(kind){
  const f = document.getElementById('impFile').files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { const t = document.getElementById('impText'); if (t) t.value = String(r.result || ''); };
  r.readAsText(f);
}

/* ---------- Barcode labels (Code128-B, offline) ---------- */
const C128=["11011001100","11001101100","11001100110","10010011000","10010001100","10001001100","10011001000","10011000100","10001100100","11001001000","11001000100","11000100100","10110011100","10011011100","10011001110","10111001100","10011101100","10011100110","11001110010","11001011100","11001001110","11011100100","11001110100","11101101110","11101001100","11100101100","11100100110","11101100100","11100110100","11100110010","11011011000","11011000110","11000110110","10100011000","10001011000","10001000110","10110001000","10001101000","10001100010","11010001000","11000101000","11000100010","10110111000","10110001110","10001101110","10111011000","10111000110","10001110110","11101110110","11010001110","11000101110","11011101000","11011100010","11011101110","11101011000","11101000110","11100010110","11101101000","11101100010","11100011010","11101111010","11001000010","11110001010","10100110000","10100001100","10010110000","10010000110","10000101100","10000100110","10110010000","10110000100","10011010000","10011000010","10000110100","10000110010","11000010010","11001010000","11110111010","11000010100","10001111010","10100111100","10010111100","10010011110","10111100100","10011110100","10011110010","11110100100","11110010100","11110010010","11011011110","11011110110","11110110110","10101111000","10100011110","10001011110","10111101000","10111100010","11110101000","11110100010","10111011110","10111101110","11101011110","11110101110","11010000100","11010010000","11010011100","11000111010"];
function code128SVG(text){
  const t=String(text||'').replace(/[^\x20-\x7E]/g,'');
  if(!t)return '';
  const vals=[104];
  for(const c of t)vals.push(c.charCodeAt(0)-32);
  let sum=104;
  for(let i=1;i<vals.length;i++)sum+=vals[i]*i;
  vals.push(sum%103);
  let bits=vals.map(v=>C128[v]).join('')+C128[106]+'11';
  let rects='',i=0;
  while(i<bits.length){let j=i;while(j<bits.length&&bits[j]===bits[i])j++;if(bits[i]==='1')rects+=`<rect x="${i}" y="0" width="${j-i}" height="42" fill="#000"/>`;i=j;}
  return `<svg viewBox="0 0 ${bits.length} 46" width="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="display:block">${rects}</svg>`;
}
function openLabelModal(){
  if(!needEdit('inventory'))return;
  const prods=db.products.filter(p=>p.role!=='service');
  if(!prods.length){toast('No products to print','err');return;}
  openModal('Print Barcode Labels',`
    <div class="small muted">Print adhesive-label sheets with Code128 barcodes (scan at billing). Set copies per product — 0 skips it. Barcode = product barcode, else SKU.</div>
    <div style="max-height:320px;overflow-y:auto;margin-top:10px" class="card">
    ${prods.map(p=>`<div class="lrow">
      <div class="l-main"><div class="l-t">${esc(p.name)}</div><div class="l-s">${esc(p.sku)} · ₹${nf(p.price)}${p.barcode?' · code '+esc(p.barcode):''}</div></div>
      <input id="lab_${p.id}" class="input" type="number" min="0" style="width:70px;text-align:center" value="0">
    </div>`).join('')}</div>
  `,`<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:1.2" onclick="printLabels()">${I.print} Print Labels</button>`);
}
function printLabels(){
  const rows=[];
  db.products.forEach(p=>{
    if(p.role==='service')return;
    const el=document.getElementById('lab_'+p.id);
    const n=el?Math.max(0,Math.floor(num(el.value))):0;
    for(let i=0;i<n;i++)rows.push(p);
  });
  if(!rows.length){toast('Choose at least 1 copy of some product','err');return;}
  const cells=rows.map(p=>{
    const code=String(p.barcode||p.sku||p.id);
    return `<div style="border:1px dashed #bbb;padding:6px 8px;text-align:center;page-break-inside:avoid;overflow:hidden">
      <div style="font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden">${esc(db.settings.shopName)}</div>
      <div style="font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden">${esc(p.name)}</div>
      <div style="font-size:13px;font-weight:800">₹ ${nf(p.price)}</div>
      ${code128SVG(code)}
      <div style="font-size:8px;letter-spacing:1px">${esc(code)}</div>
    </div>`;
  }).join('');
  const pa=document.getElementById('printArea');
  if(!pa)return;
  pa.className='a4';
  pa.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:5mm">${cells}</div>`;
  doPrint();
  setTimeout(()=>{pa.innerHTML='';},1500);
}
function restoreBackup(input){
  if(!needOwner())return;
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const data=JSON.parse(r.result);
    if(!data.products||!data.settings)throw new Error('bad');
    db=data;db.settings=Object.assign(defaultSettings(),data.settings||{});
    db.returns=db.returns||[];db.expenses=db.expenses||[];
    save();S.pos=null;S.currentInvoice=null;S.view='dashboard';applyTheme();render();toast('Backup restored successfully','ok');
  }catch(e){toast('Invalid backup file','err');}};
  r.readAsText(f);input.value='';
}
function eraseAll(){
  if(!needOwner())return;
  askConfirm('<b>ERASE ALL DATA?</b> This cannot be undone. A backup file will be downloaded first.',()=>{
    backup(true);
    askConfirm('Are you <b>really</b> sure? The backup was just downloaded — keep it somewhere safe.',()=>{
      db={settings:defaultSettings(),products:[],customers:[],suppliers:[],invoices:[],purchases:[],returns:[],expenses:[],production:[],jobwork:[],estimates:[],employees:[],attendance:[],payroll:[],audits:[],payments:[],cashLogs:[],counters:{invoice:0,purchase:0,ret:0,production:0,jobwork:0,est:0}};
      save();S.pos=null;S.view='dashboard';applyTheme();render();toast('All data erased — fresh start','ok');
    },'Yes, Erase Everything');
  },'Continue');
}

/* ---------- Keyboard shortcuts ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();return;}
  if(!db)return;
  if(e.altKey&&e.key==='n'){e.preventDefault();go('pos');}
  if(e.altKey&&e.key==='d'){e.preventDefault();go('dashboard');}
});

/* ---------- Responsive re-render ---------- */
let rt=null;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.view==='invoices')refreshInv();},200);});

/* ---------- Boot ---------- */
function bootApp(){
  applyTheme();
  try{window.addEventListener&&window.addEventListener('hashchange',applyHashRoute);}catch(e){}
  const hr=parseHash();if(hr&&hr.view!=='dashboard')navFromHash(hr);
  render();
  if(db.settings.pinOn&&/^\d{4}$/.test(db.settings.pin||''))showLock();
  if(!S.user&&userRolesOn())showUserPicker();
}
(function boot(){
  if(!loadMaster()){
    master={shops:[],activeId:null,customTypes:[]};
    try{
      const raw=localStorage.getItem('mobidukaan_pro_v3');
      if(raw){
        const d=JSON.parse(raw);
        const id=uid();
        master.shops.push({id,name:(d.settings&&d.settings.shopName)||'My Shop',type:'oilmill',dbKey:'mobidukaan_pro_shop_'+id,createdAt:Date.now()});
        master.activeId=id;
        saveMaster();
        localStorage.setItem(master.shops[0].dbKey,raw);
      }
    }catch(e){}
    saveMaster();
  }
  if(master.activeId&&load()){bootApp();}
  else{showShopPicker();}
})();
